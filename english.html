<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24555C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꿈틀나비 Q&amp;A">
<title>꿈틀나비 Q&amp;A — 나만의 영어 표현 학습장</title>
<link rel="icon" type="image/png" href="english-180.png">
<link rel="apple-touch-icon" href="english-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F3FA; --card:#fffdf8; --ink:#24384A; --sub:#68808F; --muted:#7A8C98; --line:#D9E6EF;
  --accent:#2A5D80; --accent-soft:#E3EEF5; --gold:#E8A33D; --gold-soft:#FFF1C7; --gold-ink:#8A5800;
  --r:16px; --shadow:0 2px 8px rgba(40,80,120,.09);
  --hdr:rgba(232,243,250,.95); --seg:#D3E6F2; --bw:1px; --strong:#24384A;
  --s1:#E8A33D; --s2:#3FC1C9; --s3:#FF7A59; --s4:#5DBB63;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.en,.e,.en2{font-family:"Nunito",sans-serif}
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:8px;padding:14px 14px 8px 16px;position:sticky;top:0;z-index:30;background:var(--hdr);backdrop-filter:blur(8px)}
.brand{flex:1;font-family:"Jua",sans-serif;font-size:21px;display:flex;align-items:center;gap:6px;line-height:1.1}
.brand small{display:block;font-family:"Nunito",sans-serif;font-weight:600;font-size:11.5px;color:var(--sub)}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.sync.ok i{background:#3d8a5c}.sync.busy i{background:#E8A33D}.sync.err i{background:#d9534f}
@media (max-width:400px){ .sync span{display:none} }
.tool{border:1px solid var(--line);background:#fff;border-radius:12px;height:36px;min-width:36px;padding:0 9px;display:flex;align-items:center;gap:4px;font-size:15px;text-decoration:none;color:var(--ink)}
main{flex:1;padding:4px 14px 20px}
nav.tabs{display:flex;gap:4px;position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0;border-radius:12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--gold-ink);background:var(--gold-soft);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45}
.big-btn{width:100%;padding:14px;font-size:16px;border-radius:14px}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%;min-width:0}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.insight{background:var(--gold-soft);border:1px solid #F1DFB8;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
.hello{display:flex;align-items:center;gap:12px}
.hello .d{font-size:13px;color:var(--sub)}
.hello .t{font-family:"Jua",sans-serif;font-size:19px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.stat{background:var(--accent-soft);border-radius:12px;padding:9px 4px;text-align:center;border:0;font:inherit;color:inherit}
button.stat:disabled{opacity:1}
button.stat.on{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.gradbox{margin-top:8px;border:1.5px solid var(--gold);border-radius:12px;background:#fff;max-height:300px;overflow:auto;padding:4px 10px}
.gradbox .gh{font-size:12.5px;font-weight:700;color:var(--gold-ink);padding:6px 0 4px}
.gradbox .gi{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.gradbox .gi .muted{font-size:12.5px}
.gradbox .lb{font-size:16px}
.stat b{display:block;font-family:"Nunito",sans-serif;font-size:20px;color:var(--accent)}
.stat span{font-size:11.5px;color:var(--sub)}
.recent .crow{border-bottom:1px dashed var(--line)}
/* 찾기 */
.dict .q{display:flex;gap:6px}
.dict .q .btn{white-space:nowrap}
.res{margin-top:12px}
.res:empty{display:none}
.ent{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.55}
.ent:last-child{border-bottom:0}
.ent b{font-size:15px}.ent.big b{font-family:"Nunito",sans-serif;font-size:19px}
.pos{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-right:4px}
.ex{color:var(--sub);font-style:italic;font-size:13px}
.ext{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ext a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;color:var(--ink)}
.trn textarea,.pastetx{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffef9;resize:vertical;line-height:1.5;font-size:15px}
.trn .mrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.best{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:6px}
.best .en{font-weight:700;font-size:18px;line-height:1.5}
.alt{border-bottom:1px dashed var(--line);padding:10px 2px}
.alt .en2{font-weight:700;font-size:15.5px}
.alt .note{font-size:12.5px;color:var(--sub);margin-top:2px}
.askc{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#FBF1EA;border:1px solid #EBCDB8;color:#7A3E1D;text-decoration:none;font-size:14px;line-height:1.4}
.askc b{font-weight:700}.askc .sub{display:block;font-size:12px;opacity:.8}.askc .go{margin-left:auto;font-size:18px}
.cardbox{margin-top:12px;border:1.5px dashed #E9C46A;background:#FFFBEA;border-radius:14px;padding:10px 12px}
.cardbox label{display:block;font-size:12px;color:var(--muted);margin:6px 0 3px}
.starbtn{margin-top:10px;width:100%;border:1.5px solid #E9C46A;background:#FFF6D6;color:#7a5b00;border-radius:12px;padding:10px;font-size:14px;font-weight:700}
.starbtn.ok{background:#EEF6E8;border-color:#A8CB92;color:#3f6b2a}
/* 복습·창고 */
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
.chips2 button.on{background:var(--accent);border-color:transparent;color:#fff}
.chips2 button:disabled{opacity:.4}
.lbl{font-size:12.5px;color:var(--muted);margin-top:6px}
.clist{border-top:1px solid var(--line)}
.crow{display:flex;gap:8px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.45}
.crow .k{flex:1;min-width:0}.crow .e{font-weight:700;color:#1f4e6a}
.crow .m{font-size:11.5px;color:var(--muted)}
.crow button{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px}
.play{text-align:center;padding:6px 0}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 14px}.prog i{display:block;height:100%;background:#FFD60A}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 16px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.qcard .ask{font-size:19px;font-weight:600;line-height:1.5;word-break:keep-all}
.qcard .hint{font-size:12px;color:var(--muted)}
.ans{margin-top:12px;background:var(--accent-soft);border-radius:14px;padding:14px;font-size:17px;font-weight:600;line-height:1.5}
.ans .note{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:12px}.btns .btn{flex:1;padding:12px;font-size:15px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.4;color:var(--ink)}
.opts button.right{border-color:#5aa36a;background:#EAF6EC}.opts button.wrong{border-color:#d9534f;background:#FBECEB}
.say{border:0;background:none;font-size:18px;padding:0 4px;vertical-align:middle;color:inherit}
.say.playing{animation:sayPulse .6s ease-in-out infinite alternate}
@keyframes sayPulse{to{transform:scale(1.25);filter:drop-shadow(0 0 4px #3FC1C9)}}
.done{text-align:center;padding:10px 0}.done .big{font-size:40px}
.add2{display:flex;gap:8px;margin:2px 0 12px}
.add2 button{flex:1;border:1.5px dashed #C9DCEA;background:#fff;border-radius:12px;padding:11px 6px;font-size:14px;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.42);display:none;align-items:flex-start;justify-content:center;z-index:100;padding-top:max(10px,env(safe-area-inset-top))}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:calc(100vh - 20px);overflow:auto;border-radius:20px;padding:18px}
.sheet h2{margin:0 0 12px;font-size:17px}
.field{margin-bottom:10px}.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:120;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1}.toast.act{pointer-events:auto}
.toast button{margin-left:10px;background:none;border:0;color:#ffd60a;font-weight:700;padding:0}
/* 배우기 */
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.labels button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;font-size:12px;word-break:keep-all;line-height:1.3;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.labels button span{font-size:22px}
.labels button{position:relative}
.labels .lbadge{position:absolute;top:-7px;right:-3px;font-style:normal;font-size:9.5px;font-weight:700;line-height:1;padding:3px 5px;border-radius:9px;background:var(--gold);color:#fff;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.labels button.on{border-color:var(--gold);background:var(--gold-soft);font-weight:700;color:var(--gold-ink)}
.guide{font-size:13.5px;line-height:1.6;color:var(--sub);margin:0 0 8px}
.learn .guide{margin:12px 0 10px}
.guide b{color:var(--ink);display:block;font-size:14px}
.guide span{display:block;font-size:12.5px;color:var(--muted)}
.learn textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffef9;resize:vertical;line-height:1.5;font-size:15px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-right:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.t{background:var(--gold-soft);color:var(--gold-ink)}
.scene{font-size:12.5px;color:var(--sub);margin-top:2px}
.yg{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:#fff;color:var(--ink);white-space:nowrap}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.rate .btn{padding:12px 4px;font-size:14px}
.rate .bad{border-color:#f0c7c4;background:#FBECEB}.rate .mid{border-color:#F1DFB8;background:#FFF6D6}.rate .good{background:var(--accent);border-color:var(--accent);color:#fff}
.grad{margin-top:8px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}
.bars .b{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.bars .b span:first-child{width:92px;flex:none;color:var(--sub)}
.bars .track{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bars .track i{display:block;height:100%;background:#E8A33D}
.selrow{display:flex;gap:6px;margin-top:8px}
.selrow select{flex:0 0 118px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:0}
.cardbox select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.notice{background:#FBECEB;border:1px solid #f0c7c4;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details.drawer{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
details.drawer[open]{border-color:#E9C46A}
.dms{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dm{display:block;width:30px;height:14px;border-radius:4px;border:1px solid #C9DCEA;background:linear-gradient(90deg,#C9DCEA var(--p),#fff var(--p))}
.dm.full{background:#E8A33D;border-color:#E8A33D}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.duo .btn{padding:12px 8px;border-radius:14px;display:flex;flex-direction:column;gap:2px;align-items:center}
.duo .btn b{font-size:15px}.duo .btn span{font-size:12px;opacity:.85}
.learn .labels{margin-bottom:0}
/* 열기 화면 */
#splash{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 40%,#FFFCF2,#F4EEDC);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{overflow:visible}
#splash .st{text-align:center;opacity:0;transform:translateY(8px);animation:sp-up .5s 2.25s forwards;margin-top:6px}
#splash .st b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em;color:#24384A}
#splash .st span{font-family:"Nunito",sans-serif;font-weight:800;color:#E8603C;font-size:16px}
@keyframes sp-up{to{opacity:1;transform:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;text-align:center}
.cal b{font-size:11px;color:var(--muted);font-weight:600}
.cal span{position:relative;font-size:12px;line-height:28px;height:28px;border-radius:50%;color:var(--ink)}
.cal span.on{background:#F2B632;color:#fff;font-weight:800}
.cal span.ring{box-shadow:inset 0 0 0 2px #2E9E95}
.cal span.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.cal span.fut{opacity:.35}
details.mon-g{border-top:1px solid var(--line)}
details.mon-g summary{display:flex;align-items:center;gap:8px;padding:11px 2px;font-weight:700;font-size:14.5px}
details.mon-g .more-btn{width:100%;margin:8px 0 10px;border-style:dashed;color:var(--accent)}
details.weak summary{list-style:none;cursor:pointer}
details.weak .chev{color:var(--muted);display:inline-block;transition:transform .2s}
details.weak:not([open]) .chev{transform:rotate(-90deg)}
details.mon-g .chev{color:var(--muted);transition:transform .2s;display:inline-block}
details.mon-g:not([open]) .chev{transform:rotate(-90deg)}
.topics{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.topics .tg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.topics .tg span{font-size:11.5px;color:var(--muted);width:64px;flex:none}
.topics button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.topics button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.cul{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 0 8px}
.cul button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0 5px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
.cul button span{font-size:19px;line-height:1.1}
.cul button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.cul+.cnt,.cnt{font-size:12px;color:var(--sub);margin:2px 0 6px}
.cnt b{color:var(--accent)}
.bagbtn{border:0;background:none;color:var(--accent);font-size:12.5px;padding:2px 0;margin:0 0 6px}
.bag{border:1px dashed #C9DCEA;border-radius:12px;padding:10px;margin:0 0 10px;background:#fff}
.bag .tp{display:inline-flex;align-items:center;margin:0 5px 6px 0;border:1px solid var(--line);border-radius:999px;background:#fff}
.bag .tp button{border:0;background:none;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.bag .tp .x{padding:4px 8px 4px 0;color:var(--muted);font-size:11px}
.bag .tp.done{background:#EEF6E8;border-color:#A8CB92}
.exs{font-size:13px;color:#1f4e6a;margin-top:3px;line-height:1.5}
.exs .say{font-size:15px}
.exq{font-style:normal}
.exq .en{color:#1f4e6a;font-weight:600}
.cele{position:relative;height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cele .pico{font-size:64px;line-height:1;display:inline-block}
.cele .bulb{animation:bulbPop .7s cubic-bezier(.3,1.6,.6,1) both, bulbGlow 1.4s .7s ease-in-out 2}
@keyframes bulbPop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bulbGlow{50%{filter:drop-shadow(0 0 14px #FFD60A)}}
.cele .conf i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:0;animation:confFall 1.6s ease-in forwards}
@keyframes confFall{0%{opacity:1;top:-12px}100%{opacity:0;top:120px}}
.praise{font-size:24px;font-weight:800;color:#2A5D80;margin-top:4px;animation:sp-up .5s .4s both}
.praise-ko{font-size:13.5px;color:var(--sub);margin-top:2px;animation:sp-up .5s .5s both}
.remain{margin-top:12px;background:var(--gold-soft);border-radius:12px;padding:10px;font-size:13.5px}
.remain.ok{background:#EAF6EC}
.duebar{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-top:4px}
@keyframes sp-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 테마 (11j) ===== */
/* 섹션마다 다른 색 */
.seg button.on{box-shadow:var(--shadow)}
/* 진한 테두리 */
body[data-bold="1"]{--bw:1.8px;--line:var(--strong);--shadow:3px 3px 0 var(--strong)}
body[data-bold="1"] .card,body[data-bold="1"] .card.hellocard,body[data-bold="1"] .card.mon,body[data-bold="1"] .card.dict,body[data-bold="1"] .card.learn{border:var(--bw) solid var(--strong)}
body[data-bold="1"] .btn,body[data-bold="1"] .inp,body[data-bold="1"] .tool,body[data-bold="1"] .labels button,body[data-bold="1"] .stat,body[data-bold="1"] textarea{border:1.6px solid var(--strong)}
body[data-bold="1"] .btn.pri{box-shadow:2px 2px 0 var(--strong)}
body[data-bold="1"] .seg{border:1.6px solid var(--strong)}
body[data-bold="1"] nav.tabs{border-top:1.8px solid var(--strong)}

const I=(k,cls='')=>P[k]?`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`:'';

const WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(new Date());
const label=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';};
const md=s=>s?s.slice(5).replace('-','/'):'';
let uidN=0; const uid=p=>p+Date.now().toString(36)+(uidN++%1296).toString(36).padStart(2,'0')+Math.random().toString(36).slice(2,4);   // 담은 순서대로 정렬되도록
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasKo=s=>/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let VOX=null, voxName=LS.get('voice','');
const enVoices=()=>{ try{ return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){ return []; } };
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Jester|Organ|Superstar|Good News|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Sandy|Flo|Eddy|Reed|Hysterical/;
function voiceRank(v){ const n=v.name; let s=0; if(/premium|enhanced|natural|neural|향상|고음질/i.test(n)) s+=50; if(/Google US English/.test(n)) s+=40; if(/^(Ava|Samantha|Allison|Zoe|Evan|Nathan|Tom|Susan|Joelle|Noelle|Aria|Jenny|Guy|Michelle)\b/.test(n)) s+=30; if(/en[-_]US/i.test(v.lang)) s+=10; if(NOVELTY.test(n)) s-=100; return s; }
function pickVoice(){ const V=enVoices(); if(!V.length) return null; if(voxName){ const f=V.find(v=>v.name===voxName); if(f) return f; } return V.slice().sort((a,b)=>voiceRank(b)-voiceRank(a))[0]; }
function setVoice(n){ voxName=n; LS.set('voice',n); VOX=null; }
try{ speechSynthesis.addEventListener('voiceschanged',()=>{ VOX=null; }); }catch(e){}
let sayTip=LS.get('sayTip',false);
const say=(t,btn)=>{ if(!t) return; if(!('speechSynthesis' in window)){ toast('이 브라우저는 음성 듣기를 지원하지 않아요'); return; }
  try{ const ss=speechSynthesis; if(ss.speaking||ss.pending) ss.cancel(); if(ss.paused) ss.resume();
    const u=new SpeechSynthesisUtterance(t); window._sayU=u; const v=VOX||(VOX=pickVoice());
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US'; u.rate=.95;
    let started=false; u.onstart=()=>{ started=true; };
    if(btn){ btn.classList.add('playing'); u.onend=u.onerror=()=>btn.classList.remove('playing'); }
    ss.speak(u);
    if(!sayTip){ sayTip=true; LS.set('sayTip',true); toast('소리가 안 들리면 아이폰 무음 모드를 꺼 주세요'); }
    setTimeout(()=>{ if(!started && !ss.speaking){ btn&&btn.classList.remove('playing'); toast('소리가 나지 않았어요 · 무음 모드와 볼륨을 확인해 주세요'); } },1800);
  }catch(e){ toast('음성 듣기 오류: '+e.message); } };
const sayBtn=t=>t?`<button class="say" data-act="say" data-t="${esc(t)}" title="발음 듣기">${I('speaker')}</button>`:'';
const ygLink=t=>`<a class="yg" href="https://youglish.com/pronounce/${encodeURIComponent(t)}/english" target="_blank" rel="noopener">${I('youtube')} YouGlish</a>`;

  const n=M.sheet; if(!n) return; const t=today(), Q=quizCards(); let h='';
  const head=(ic,tt)=>`<div class="grab"></div><div class="shh">${I(ic)}<b>${tt}</b><button class="x" data-act="close" aria-label="닫기">${I('x')}</button></div>`;
  const row=c=>`<div class="gi"><span class="lb">${I((TYPES[tyOf(c)]||TYPES['']).i)}</span><div class="grow"><b>${esc(c.en||c.ko)}</b><div class="muted" style="font-size:12.5px">${esc(c.en?c.ko:'')}</div></div></div>`;
  if(n==='today'){ const G=S.cards.filter(c=>c.date===t); h=head('plus',`오늘 담은 카드 ${G.length}장`)+(G.length?G.map(row).join(''):'<div class="muted">오늘은 아직 담은 카드가 없어요.</div>'); }
  if(n==='grad'){ const G=Q.filter(c=>c.lv>=7).sort((a,b)=>String(b.last||b.date).localeCompare(String(a.last||a.date))); h=head('grad',`졸업한 카드 ${G.length}장`)+(G.length?G.map(row).join(''):'<div class="muted">아직 졸업한 카드가 없어요.</div>'); }
  if(n==='cal') h=head('cal','복습 기록')+monthCard();
  if(n==='dict') h=head('book','사전')+`<div class="dict">${dictInner()}</div>`;
  if(n==='total'){
    const yNow=t.slice(0,4), wk={}, mo={}, yr={};
    Q.forEach(c=>{ const d=String(c.date||''); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return; yr[d.slice(0,4)]=(yr[d.slice(0,4)]||0)+1; if(d.slice(0,4)===yNow) mo[d.slice(0,7)]=(mo[d.slice(0,7)]||0)+1; const w=addDays(d,-parse(d).getDay()); wk[w]=(wk[w]||0)+1; });
    const cur=addDays(t,-parse(t).getDay());
    const W=[4,3,2,1,0].map(k=>{ const a=addDays(cur,-7*k); return [wkLabel(a),wk[a]||0,k===0]; });
    const Mo=Object.keys(mo).sort().map(m=>[(+m.slice(5))+'월',mo[m],m===t.slice(0,7)]);
    const Y=Object.keys(yr).sort().map(y=>[y+'년',yr[y],y===yNow]);
    const tabs=[['주별',W],['월별',Mo]].concat(Y.length>1?[['연도별',Y]]:[]);
    const ti=Math.min(M.tot||0,tabs.length-1), L=tabs[ti][1], mx=Math.max(1,...L.map(x=>x[1]));
    h=head('archive','담은 카드')+`<div class="yrbox"><span>${yNow}년에 담은 카드</span><b>${yr[yNow]||0}장</b></div>
      <div class="seg">${tabs.map((x,j)=>`<button class="${j===ti?'on':''}" data-act="tt" data-v="${j}">${x[0]}</button>`).join('')}</div>
      <div class="tbars">${L.length?L.map(([l,v,now])=>`<div class="tbar ${now?'now':''}"><span>${l}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><b>${v}</b></div>`).join(''):'<div class="muted">아직 기록이 없어요.</div>'}</div>`;
  }
  const y=$sheet.scrollTop; $sheet.innerHTML=h; $modal.classList.add('show','bs'); $sheet.scrollTop=y;
}

async function api(params,ms=20000){
  if(DEMO()) throw new Error('demo');
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms);
  let r; try{ r=await fetch(cfg.api+'?key='+encodeURIComponent(cfg.key)+'&'+new URLSearchParams(params),{signal:ac.signal}); }
  catch(e){ throw new Error(e.name==='AbortError'?'timeout':'net'); } finally{ clearTimeout(t); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('server-html'); }
  if(!j.ok) throw new Error(j.error||'fail');
  if(j.data && !('text' in j) && !('best' in j) && !('items' in j)) throw new Error('oldserver');
  return j;
}

    timeout:'서버가 20초 안에 답하지 않았어요. 앱스스크립트는 한동안 안 쓰면 깨어나는 데 시간이 걸려요. 한 번 더 눌러 보세요.',
    net:'인터넷 연결이 불안정하거나 서버 주소에 닿지 못했어요.',
    'server-html':"서버가 데이터 대신 웹페이지를 보냈어요. 앱스스크립트 배포의 액세스 권한이 '모든 사용자'인지 확인해 주세요.",
    oldserver:'서버(Code.gs)가 사전 기능이 없는 예전 버전이에요.',
    none:'앱 안에서는 결과를 찾지 못했어요. 아래 사전에서 확인해 보세요.',
    nokey:'국어사전 뜻풀이를 앱 안에서 보려면 표준국어대사전 인증키가 필요해요. 아래 사전은 바로 열 수 있어요.'};
  return `<div class="muted">${W[m]||('서버가 이렇게 답했어요: <b>'+esc(m)+'</b>')}</div>`;

async function enDefs(word){
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()));
  if(r.status===404) return '';
  const j=await r.json(); const e=j[0]; const ph=(e.phonetics||[]).find(p=>p.text)?.text||e.phonetic||'';
  return `<div class="ent"><b class="en">${esc(e.word)}</b> ${sayBtn(e.word)} <span class="muted">${esc(ph)}</span></div>`+e.meanings.slice(0,4).map(m=>`<div class="ent"><span class="pos">${esc(m.partOfSpeech)}</span>${m.definitions.slice(0,2).map(d=>`${esc(d.definition)}${d.example?`<div class="ex">“${esc(d.example)}”</div>`:''}`).join('<br>')}</div>`).join('');
}
const WAIT=t=>`<div class="muted">${t}</div><div class="muted" style="font-size:12px;margin-top:4px">처음 찾을 때는 서버가 깨어나느라 5~10초 걸릴 수 있어요.</div>`;

async function dictSearch(){
  const q=(document.getElementById('dq')?.value||'').trim(); if(!q) return;
  M.dq=q; const lang=M.lang, ko=hasKo(q); let card=null; M.card=null; M.cst='';
  const ext=lang==='ko'?extLinks('ko',q):ko?extLinks('ko2en',q):extLinks('en',q);
  M.dres=WAIT('찾는 중…'); M.dext=ext; render();
  let body='';
  try{
    if(lang==='ko'){
      const j=await api({action:'dict',q}); if(!j.items.length) throw new Error('none');
      body=j.items.slice(0,8).map(it=>`<div class="ent"><b>${esc(String(it.word).replace(/\^/g,' ').replace(/-/g,''))}</b>${it.sup&&it.sup!=='0'?`<sup>${esc(it.sup)}</sup>`:''} ${it.pos?`<span class="pos">${esc(it.pos)}</span>`:''}<br>${esc(it.def)}</div>`).join('');
    } else if(ko){
      const j=await api({action:'tr',q,from:'ko',to:'en'});
      body=`<div class="ent big"><b>${esc(j.text)}</b> ${sayBtn(j.text)}<div class="muted">‘${esc(q)}’ → 영어</div></div>`; card={ko:q,en:j.text,note:''};
      if(j.text && j.text.trim().split(/\s+/).length<=2){ try{ const d=await enDefs(j.text.trim().split(/\s+/).pop()); if(d) body+=d; }catch(e){} }
    } else {
      let err='', kt='';
      const [d,k]=await Promise.all([ enDefs(q).catch(()=>''),
        api({action:'tr',q,from:'en',to:'ko'}).then(j=>{ kt=j.text; return `<div class="ent">우리말: <b>${esc(j.text)}</b></div>`; }).catch(e=>{ err=String(e.message); return ''; }) ]);
      card={ko:kt,en:q,note:''};
      if(!d&&!k) throw new Error(DEMO()?'demo':(err||'none'));
      body=k+d;
    }
  }catch(e){ body=whyMsg(String(e.message)); }
  if(M.dq!==q) return;
  M.card=card; M.dres=body; M.dext=ext; if(M.tab==='today') render();
}
function cardBox(){
  if(!M.card || (!M.card.en && !M.card.ko)) return '';
  if(M.cst==='saved') return `<button class="starbtn ok" data-act="tab" data-v="store">담았어요 · 서랍장 보기</button>`;
  if(M.cst!=='edit') return `<button class="starbtn" data-act="cardEdit">창고에 담기</button>`;
  return `<div class="cardbox"><b style="font-size:14px">이렇게 담을까요?</b> <span class="muted" style="font-size:12px">고쳐서 담아도 돼요</span>${cardForm({...M.card,type:'word'},'cardSave')}</div>`;
}

const TYPE_WORD={'저울':'scale','뉘앙스':'scale','뇌':'brain','영어뇌':'brain','영어 뇌':'brain','찰떡':'fit','나침반':'compass','수업':'class','빨간펜':'class','통찰':'insight','소개':'culture','문답':'culture','독해':'read','읽기':'read'};
/* 라벨 이름이 조금 달라도 알아보기: '찰떡 표현', '찰떡', '[영어 뇌]', '뉘앙스 저울' 등 */
function labelOf(w){
  const n=String(w||'').replace(/[^가-힣a-zA-Z]/g,'').toLowerCase(); if(!n||n.length>8) return null;
  if(/^(뉘앙스)?저울$|^뉘앙스$/.test(n)) return 'scale';
  if(/^(영어)?뇌$/.test(n)) return 'brain';
  if(/^찰떡(표현)?$/.test(n)) return 'fit';
  if(/^나침반$/.test(n)) return 'compass';
  if(/^(독해|읽기|읽기노트|dearabby)$/.test(n)) return 'read';
  if(/^(소개|문화소개|문답|질문|hifromkorea)$/.test(n)) return 'culture';
  if(/^(수업|수업소재|빨간펜)$/.test(n)) return 'class';
  if(/^통찰(한스푼)?$/.test(n)) return 'insight';
  return null;
}

    let yg=''; if(p.length && /^YG$/i.test(p[p.length-1])){ yg='1'; p.pop(); }
    const ty=TYPE_WORD[p[0]]||labelOf(p[0]); let c;
    if(ty){ const [,a='',b='',x='',y='',z='']=p;
      if(ty==='scale') c={type:ty,ko:a,en:b,opts:x,note:y,cat:normCat(z)};
      else if(ty==='brain'||ty==='fit') c = p.length>=6 ? {type:ty,ko:a,en:b,note:x,scene:y,cat:normCat(z)} : {type:ty,ko:a,en:b,scene:x,cat:normCat(y)};   // 새 형식: 우리말 :: 영어 :: 예문 :: 쓰임 장면 :: 분류
      else if(ty==='compass') c={type:ty,ko:a,en:b,note:x,cat:normCat(y)};
      else if(ty==='insight') c={type:ty,ko:a,en:b,note:x,cat:normCat(y)};
      else if(ty==='culture'){ const qa=/문답|질문|qa/i.test(p[0]);
        c = !qa && p.length>=6 ? {type:ty,ko:a,en:b,note:(x?x+' ¦ ':'')+y,cat:normCat(z),opts:'intro'} : {type:ty,ko:a,en:b,note:x,cat:normCat(y),opts:qa?'qa':'intro'}; }
      else if(ty==='read') c = p.length>=6 ? {type:ty,ko:a,scene:b,en:x,opts:y,note:p.slice(5).join(' · ')} : {type:ty,ko:a,en:b,note:x};   // 새 형식: 제목 :: 처음 :: 고친 :: 모범 :: 고민
      else c={type:ty,ko:a,en:b,note:x};
    } else { let [a='',b='',x='']=p; if(!hasKo(a)&&hasKo(b)) [a,b]=[b,a]; if(/^(우리말|한국어|korean)$/i.test(a)) return; const d=M.paste.def??defLabel();
      c = d ? {type:d,ko:a,en:b,scene:x,note:p.slice(3).join(' · '),nolabel:true} : {type:'',ko:a,en:b,note:p.slice(2).join(' · ')||x,nolabel:true}; }
    if(!c.ko||!c.en) return; c.yg=yg;
    const k=(c.type+'|'+c.ko+'|'+c.en).toLowerCase(); if(seen.has(k)) return; seen.add(k);
    const same=x=>x.en.trim().toLowerCase().replace(/[.!?]+$/,'')===c.en.trim().toLowerCase().replace(/[.!?]+$/,'');
    const old=S.cards.find(x=>x.ko===c.ko && same(x)) || ((c.type==='brain'||c.type==='fit') && isEx(c.note) ? S.cards.find(x=>EXT(x.type) && same(x) && !isEx(x.note)) : null);
    c.dup=!!old; c.fill = old && (c.type==='brain'||c.type==='fit') && EXT(old.type) && isEx(c.note) && !isEx(old.note) ? old.id : '';   // 이미 있는 카드에 예문만 채우기
    c.on=!c.dup||!!c.fill; out.push(c);
  });
  const rd=out.find(c=>c.type==='read');   // 같은 블록의 표현 카드에 출처 자동으로
  if(rd) out.forEach(c=>{ if(c!==rd && !SHELF(c.type) && !c.src) c.src='📰 Dear Abby · '+rd.ko; });

  if(cu) out.forEach(c=>{ if(c!==cu && !SHELF(c.type) && !c.src) c.src='👋 Hi from Korea · '+cu.ko; });
  return out;
}

const SET_SIZE=25, ANCHOR='2026-01-05';   // 2주 묶음 기준 월요일

const DRAWER_TYPES=['scale','brain','fit','compass','culture','word','','read','class','insight'];
function drawersOf(ty){ const L=S.cards.filter(c=>tyOf(c)===ty).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id)); const out=[]; L.forEach((c,i)=>{ const k=Math.floor(i/SET_SIZE); (out[k]=out[k]||[]).push(c); }); return out; }
const bwStart = s => addDays(ANCHOR, Math.floor((parse(s)-parse(ANCHOR))/864e5/14)*14);
const range = L => { const d=L.map(c=>c.date).sort(); return d.length?`${md(d[0])}~${md(d[d.length-1])}`:''; };
function inPeriod(c,per){
  const t=today();
  if(per==='all') return true;
  if(per==='today') return c.date===t;
  if(per==='2w') return c.date>=addDays(t,-13);
  if(per==='month') return c.date.slice(0,7)===t.slice(0,7);
  if(per.startsWith('m:')) return c.date.slice(0,7)===per.slice(2);
  if(per.startsWith('b:')){ const a=per.slice(2); return c.date>=a && c.date<=addDays(a,13); }
  if(per.startsWith('s:')){ const [,ty,k]=per.split(':'); return (drawersOf(ty)[+k-1]||[]).some(x=>x.id===c.id); }
  return true;
}

function qzStart(ids,isDueRun){
  const Z=M.qz||(M.qz={per:'all',kind:'all',cnt:20,dir:'ko',run:null});

  if(!ids && !isDueRun && Z.cnt) pool=pool.slice(0,Z.cnt);
  Z.run={queue:shuffle(pool.map(c=>c.id)), i:0, first:{}, show:false, pick:null, total:pool.length, done:false, srs:!!isDueRun};

function qzCur(){ const R=M.qz.run; return S.cards.find(c=>c.id===R.queue[R.i]); }
function scaleOpts(c){
  const R=M.qz.run; if(R.opts && R.opts.id===c.id) return R.opts.list;
  let L=String(c.opts||'').split('/').map(s=>s.trim()).filter(Boolean);

(function splash(){ const el=document.getElementById('splash'); if(!el) return; let done=false;
  const svg=el.querySelector('.spv'), ti=el.querySelector('.st');
  const finish=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),500); };
  el.addEventListener('click',finish);
  /* 하나의 시간 흐름 위에서 매 순간 다시 그림 — 동작이 서로 겹쳐 부드럽게 이어짐 */
  const f=n=>(+n).toFixed(2), cl=x=>x<0?0:x>1?1:x, ss=t=>{t=cl(t);return t*t*(3-2*t)}, sm=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  const win=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,t)=>a+(b-a)*t;
  const qb=(a,c,b,t)=>{const u=1-t;return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]];};
  const smooth=P=>{ let d=`M${f(P[0][0])} ${f(P[0][1])}`; for(let i=1;i<P.length;i++){ const a=P[i-1],b=P[i]; d+=` Q${f(a[0])} ${f(a[1])} ${f((a[0]+b[0])/2)} ${f((a[1]+b[1])/2)}`; } const l=P[P.length-1]; return d+` L${f(l[0])} ${f(l[1])}`; };
  const C={soil:'#B98A62',soil2:'#9C7150',stem:'var(--pri)',leaf:'var(--c6)',leaf2:'var(--c2)',water:'var(--c2)',can:'var(--hi)',cap:'var(--pri)',glow:'var(--hi-soft)'};
  const can=(tx,ty,ang,op)=>`<g transform="translate(${f(tx)} ${f(ty)}) rotate(${f(ang)} 142 57)" opacity="${f(op)}"><path d="M124 52 L98 38" stroke="${C.can}" stroke-width="6" stroke-linecap="round"/><ellipse cx="96" cy="37" rx="4.5" ry="6.5" transform="rotate(-28 96 37)" fill="${C.can}"/><rect x="120" y="44" width="44" height="34" rx="9" fill="${C.can}"/><path d="M160 50 C174 50 174 70 160 70" fill="none" stroke="${C.can}" stroke-width="5" stroke-linecap="round"/><rect x="126" y="40" width="30" height="6" rx="3" fill="${C.cap}"/></g>`;
  const rose=(tx,ty,ang)=>{ const a=ang*Math.PI/180, dx=-49, dy=-15; return [142+dx*Math.cos(a)-dy*Math.sin(a)+tx, 57+dx*Math.sin(a)+dy*Math.cos(a)+ty]; };
  const stream=(R,G,head,tail,w,flow)=>{ if(head<=tail+.001||w<=.02) return '';
    return '<g fill="none" stroke-linecap="round">'+[[-2.6,-11],[0,0],[2.6,11]].map(([a,b],k)=>{ const r=[R[0]+a,R[1]+a*.4], g=[G[0]+b,G[1]+(k===1?0:1.2)], c=[R[0]-10+b*.35,R[1]+30], P=[];
      for(let i=0;i<=24;i++) P.push(qb(r,c,g,lerp(tail,head,i/24)));
      return `<path d="${smooth(P)}" stroke="${C.water}" stroke-width="${f(2.6*w)}" stroke-dasharray="5 6.5" stroke-dashoffset="${f(-flow-k*3.5)}" opacity="${k===1?.95:.8}"/>`; }).join('')+'</g>'; };
  const leafL=(x,y,rot,sc)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${f(sc)})"><path d="M0 4 C-13 3 -22 -6 -20 -16 C-8 -17 0 -8 0 4Z" fill="${C.leaf}"/><path d="M0 2 C-6 -4 -11 -8 -16 -13" stroke="#fff" stroke-opacity=".35" stroke-width="1" fill="none" stroke-linecap="round"/></g>`;
  const leafR=(x,y,rot,sc)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${f(sc)})"><path d="M0 2 C10 -5 22 -4 26 -13 C15 -18 3 -12 0 2Z" fill="${C.leaf2}"/><path d="M1 0 C8 -5 14 -8 21 -11" stroke="#fff" stroke-opacity=".4" stroke-width="1" fill="none" stroke-linecap="round"/></g>`;
  function scene(ms){ const t=ms/1000;
    const soilIn=ss(win(t,0,.6)), canIn=sm(win(t,.1,1.0)), tilt=sm(win(t,.8,1.4)), untilt=sm(win(t,2.5,3.1)), canOut=sm(win(t,2.7,3.4));
    const breathe=t>1.4&&t<2.6?Math.sin((t-1.4)*Math.PI*1.4)*2.5:0;
    const tx=lerp(80,0,canIn)+lerp(0,16,canOut), ty=lerp(-70,0,canIn)+lerp(0,-26,canOut), ang=lerp(14,0,canIn)+lerp(0,-27,tilt)+lerp(0,27,untilt)+breathe*(1-untilt);
    const R=rose(tx,ty,ang), G=[84,138.4];
    const head=sm(win(t,1.1,1.6)), tail=sm(win(t,2.45,3.0)), w=(.92+.08*Math.sin(t*3))*ss(win(t,1.05,1.35))*(1-ss(win(t,2.7,3.05)));
    const wet=ss(win(t,1.45,2.1)), rise=sm(win(t,1.5,2.55)), straight=sm(win(t,2.2,3.15)), hook=1-straight, H=45*rise;
    const tip=[101+hook*9*rise,141-H+hook*7*rise], ctrl=[100-hook*5*rise,141-H*.62], S=[]; for(let i=0;i<=24;i++) S.push(qb([100,141],ctrl,tip,i/24));
    const open=sm(win(t,2.55,3.4)), droop=lerp(150,0,straight), sway=t>3.15?2.6*Math.exp(-(t-3.15)*1.2)*Math.sin((t-3.15)*4):0;
    const glow=ss(win(t,3.0,3.5))*(1-ss(win(t,3.6,4.3)));
    let s=`<path d="M26 162 Q100 112 174 162 Z" fill="${C.soil}" transform="translate(0 ${f(18*(1-soilIn))})" opacity="${f(soilIn)}"/>`;
    s+=`<ellipse cx="95" cy="140" rx="${f(10+13*wet)}" ry="${f(2.5+1.8*wet)}" fill="${C.soil2}" opacity="${f(.5*wet)}"/>`;
    if(glow>0) s+=`<circle cx="101" cy="94" r="${f(18+10*glow)}" fill="${C.glow}" opacity="${f(.55*glow)}"/>`;
    s+=`<g transform="rotate(${f(sway)} 100 141)">`;
    if(rise>.01){ s+=`<path d="${smooth(S)}" fill="none" stroke="${C.stem}" stroke-width="${f(2.2+1.4*rise)}" stroke-linecap="round"/>`;
      const sc=lerp(.35,1,open)*ss(win(t,1.75,2.2)); if(sc>.01) s+=leafL(tip[0],tip[1]+3,droop+lerp(30,0,open),sc)+leafR(tip[0],tip[1]+2,droop-lerp(30,0,open),sc); }
    s+='</g>'+stream(R,G,head,tail,w,ms*.022)+can(tx,ty,ang,canIn);
    return {s,title:ss(win(t,3.1,3.7))};
  }
  const TEMPO=1.2, LEN=4300*TEMPO, HOLD=700;   // 고개 들기: 약 5초 + 잠깐 머묾 (누르면 바로 넘어감)
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let t0=null;
  const step=ts=>{ if(done) return; if(!t0) t0=ts; const ms=reduce?LEN:Math.min(LEN,ts-t0), r=scene(ms/TEMPO);
    svg.innerHTML=r.s; ti.style.opacity=r.title; ti.style.transform=`translateY(${f(8*(1-r.title))}px)`;
    if(ms<LEN) requestAnimationFrame(step); else setTimeout(finish,HOLD); };
  requestAnimationFrame(step);
})();
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitPhrase);
window.addEventListener('resize',fitPhrase);
if(!DEMO()){ setSync('busy','불러오는 중…'); pull(); setInterval(()=>{ if(document.visibilityState==='visible') pull(); },60000); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
</script>
