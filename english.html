<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5D80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꿈틀나비 Q&amp;A">
<title>꿈틀나비 Q&amp;A — 나만의 영어 표현 학습장</title>
<link rel="icon" type="image/png" href="english-180.png">
<link rel="apple-touch-icon" href="english-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F3FA; --card:#fffdf8; --ink:#24384A; --sub:#68808F; --muted:#7A8C98; --line:#D9E6EF;
  --accent:#2A5D80; --accent-soft:#E3EEF5; --gold:#E8A33D; --gold-soft:#FFF1C7; --gold-ink:#8A5800;
  --r:16px; --shadow:0 2px 8px rgba(40,80,120,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.en,.e,.en2{font-family:"Nunito",sans-serif}
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:8px;padding:14px 14px 8px 16px;position:sticky;top:0;z-index:30;background:rgba(232,243,250,.95);backdrop-filter:blur(8px)}
.brand{flex:1;font-family:"Jua",sans-serif;font-size:21px;display:flex;align-items:center;gap:6px;line-height:1.1}
.brand small{display:block;font-family:"Nunito",sans-serif;font-weight:600;font-size:11.5px;color:var(--sub)}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.sync.ok i{background:#3d8a5c}.sync.busy i{background:#E8A33D}.sync.err i{background:#d9534f}
@media (max-width:400px){ .sync span{display:none} }
.tool{border:1px solid var(--line);background:#fff;border-radius:12px;height:36px;min-width:36px;padding:0 9px;display:flex;align-items:center;gap:4px;font-size:15px;text-decoration:none;color:var(--ink)}
main{flex:1;padding:4px 14px 20px}
nav.tabs{display:flex;gap:4px;position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0;border-radius:12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--gold-ink);background:var(--gold-soft);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45}
.big-btn{width:100%;padding:14px;font-size:16px;border-radius:14px}
.inp{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%;min-width:0}
.seg{display:flex;background:#D3E6F2;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.insight{background:var(--gold-soft);border:1px solid #F1DFB8;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
.hello{display:flex;align-items:center;gap:12px}
.hello .d{font-size:13px;color:var(--sub)}
.hello .t{font-family:"Jua",sans-serif;font-size:19px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stat{background:var(--accent-soft);border-radius:12px;padding:9px 4px;text-align:center}
.stat b{display:block;font-family:"Nunito",sans-serif;font-size:20px;color:var(--accent)}
.stat span{font-size:11.5px;color:var(--sub)}
.recent .crow{border-bottom:1px dashed var(--line)}
/* 찾기 */
.dict .q{display:flex;gap:6px}
.dict .q .btn{white-space:nowrap}
.res{margin-top:12px}
.res:empty{display:none}
.ent{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.55}
.ent:last-child{border-bottom:0}
.ent b{font-size:15px}.ent.big b{font-family:"Nunito",sans-serif;font-size:19px}
.pos{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-right:4px}
.ex{color:var(--sub);font-style:italic;font-size:13px}
.ext{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ext a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;color:var(--ink)}
.trn textarea,.pastetx{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffef9;resize:vertical;line-height:1.5;font-size:15px}
.trn .mrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.best{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:6px}
.best .en{font-weight:700;font-size:18px;line-height:1.5}
.alt{border-bottom:1px dashed var(--line);padding:10px 2px}
.alt .en2{font-weight:700;font-size:15.5px}
.alt .note{font-size:12.5px;color:var(--sub);margin-top:2px}
.askc{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#FBF1EA;border:1px solid #EBCDB8;color:#7A3E1D;text-decoration:none;font-size:14px;line-height:1.4}
.askc b{font-weight:700}.askc .sub{display:block;font-size:12px;opacity:.8}.askc .go{margin-left:auto;font-size:18px}
.cardbox{margin-top:12px;border:1.5px dashed #E9C46A;background:#FFFBEA;border-radius:14px;padding:10px 12px}
.cardbox label{display:block;font-size:12px;color:var(--muted);margin:6px 0 3px}
.starbtn{margin-top:10px;width:100%;border:1.5px solid #E9C46A;background:#FFF6D6;color:#7a5b00;border-radius:12px;padding:10px;font-size:14px;font-weight:700}
.starbtn.ok{background:#EEF6E8;border-color:#A8CB92;color:#3f6b2a}
/* 복습·창고 */
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;color:var(--ink)}
.chips2 button.on{background:var(--accent);border-color:transparent;color:#fff}
.chips2 button:disabled{opacity:.4}
.lbl{font-size:12.5px;color:var(--muted);margin-top:6px}
.clist{border-top:1px solid var(--line)}
.crow{display:flex;gap:8px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.45}
.crow .k{flex:1;min-width:0}.crow .e{font-weight:700;color:#1f4e6a}
.crow .m{font-size:11.5px;color:var(--muted)}
.crow button{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px}
.play{text-align:center;padding:6px 0}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 14px}.prog i{display:block;height:100%;background:#FFD60A}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 16px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:var(--shadow)}
.qcard .ask{font-size:19px;font-weight:600;line-height:1.5;word-break:keep-all}
.qcard .hint{font-size:12px;color:var(--muted)}
.ans{margin-top:12px;background:var(--accent-soft);border-radius:14px;padding:14px;font-size:17px;font-weight:600;line-height:1.5}
.ans .note{font-size:12.5px;font-weight:400;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:12px}.btns .btn{flex:1;padding:12px;font-size:15px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.4;color:var(--ink)}
.opts button.right{border-color:#5aa36a;background:#EAF6EC}.opts button.wrong{border-color:#d9534f;background:#FBECEB}
.say{border:0;background:none;font-size:18px;padding:0 4px;vertical-align:middle}
.done{text-align:center;padding:10px 0}.done .big{font-size:40px}
.add2{display:flex;gap:8px;margin:2px 0 12px}
.add2 button{flex:1;border:1.5px dashed #C9DCEA;background:#fff;border-radius:12px;padding:11px 6px;font-size:14px;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.42);display:none;align-items:flex-start;justify-content:center;z-index:100;padding-top:max(10px,env(safe-area-inset-top))}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:calc(100vh - 20px);overflow:auto;border-radius:20px;padding:18px}
.sheet h2{margin:0 0 12px;font-size:17px}
.field{margin-bottom:10px}.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:120;white-space:nowrap;max-width:92vw}
.toast.show{opacity:1}.toast.act{pointer-events:auto}
.toast button{margin-left:10px;background:none;border:0;color:#ffd60a;font-weight:700;padding:0}
/* 배우기 */
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.labels button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;font-size:12px;word-break:keep-all;line-height:1.3;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.labels button span{font-size:22px}
.labels button.on{border-color:var(--gold);background:var(--gold-soft);font-weight:700;color:var(--gold-ink)}
.guide{font-size:13.5px;line-height:1.6;color:var(--sub);margin:0 0 8px}
.learn .guide{margin:12px 0 10px}
.guide b{color:var(--ink);display:block;font-size:14px}
.guide span{display:block;font-size:12.5px;color:var(--muted)}
.learn textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffef9;resize:vertical;line-height:1.5;font-size:15px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-right:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.t{background:var(--gold-soft);color:var(--gold-ink)}
.scene{font-size:12.5px;color:var(--sub);margin-top:2px}
.yg{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:#fff;color:var(--ink);white-space:nowrap}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.rate .btn{padding:12px 4px;font-size:14px}
.rate .bad{border-color:#f0c7c4;background:#FBECEB}.rate .mid{border-color:#F1DFB8;background:#FFF6D6}.rate .good{background:var(--accent);border-color:var(--accent);color:#fff}
.grad{margin-top:8px;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}
.bars .b{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.bars .b span:first-child{width:92px;flex:none;color:var(--sub)}
.bars .track{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bars .track i{display:block;height:100%;background:#E8A33D}
.selrow{display:flex;gap:6px;margin-top:8px}
.selrow select{flex:0 0 118px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:0}
.cardbox select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.notice{background:#FBECEB;border:1px solid #f0c7c4;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details.drawer{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff}
details.drawer[open]{border-color:#E9C46A}
.dms{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dm{display:block;width:30px;height:14px;border-radius:4px;border:1px solid #C9DCEA;background:linear-gradient(90deg,#C9DCEA var(--p),#fff var(--p))}
.dm.full{background:#E8A33D;border-color:#E8A33D}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.duo .btn{padding:12px 8px;border-radius:14px;display:flex;flex-direction:column;gap:2px;align-items:center}
.duo .btn b{font-size:15px}.duo .btn span{font-size:12px;opacity:.85}
.learn .labels{margin-bottom:0}
/* 열기 화면 */
#splash{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 40%,#FFFCF2,#F4EEDC);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{overflow:visible}
#splash .st{text-align:center;opacity:0;transform:translateY(8px);animation:sp-up .5s 1.75s forwards;margin-top:6px}
#splash .st b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em;color:#24384A}
#splash .st span{font-family:"Nunito",sans-serif;font-weight:800;color:#E8603C;font-size:16px}
.sp-bulb{transform-origin:90px 95px;transform:scale(.6);opacity:0;animation:sp-pop .45s .05s cubic-bezier(.3,1.5,.6,1) forwards}
.sp-lit{opacity:0;animation:sp-fade .25s 1.05s forwards}
.sp-l{transform:translateX(-46px);opacity:0;animation:sp-l .55s .45s cubic-bezier(.3,1.4,.6,1) forwards}
.sp-r{transform:translateX(46px);opacity:0;animation:sp-r .55s .45s cubic-bezier(.3,1.4,.6,1) forwards}
.sp-q{transform-origin:138px 28px;transform:scale(0) rotate(-60deg);animation:sp-q .45s 1.35s cubic-bezier(.3,1.6,.6,1) forwards}
.sp-rays line{stroke:#F2B632;stroke-width:6;stroke-linecap:round;stroke-dasharray:14;stroke-dashoffset:14;opacity:0;animation:sp-ray .35s 1.1s forwards}
@keyframes sp-pop{to{transform:scale(1);opacity:1}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-l{to{transform:none;opacity:1}}
@keyframes sp-r{to{transform:none;opacity:1}}
@keyframes sp-q{to{transform:scale(1) rotate(0)}}
@keyframes sp-ray{from{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes sp-up{to{opacity:1;transform:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;text-align:center}
.cal b{font-size:11px;color:var(--muted);font-weight:600}
.cal span{position:relative;font-size:12px;line-height:28px;height:28px;border-radius:50%;color:var(--ink)}
.cal span.on{background:#F2B632;color:#fff;font-weight:800}
.cal span.ring{box-shadow:inset 0 0 0 2px #2E9E95}
.cal span.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.cal span.fut{opacity:.35}
details.mon-g{border-top:1px solid var(--line)}
details.mon-g summary{display:flex;align-items:center;gap:8px;padding:11px 2px;font-weight:700;font-size:14.5px}
details.mon-g .more-btn{width:100%;margin:8px 0 10px;border-style:dashed;color:var(--accent)}
details.weak summary{list-style:none;cursor:pointer}
details.weak .chev{color:var(--muted);display:inline-block;transition:transform .2s}
details.weak:not([open]) .chev{transform:rotate(-90deg)}
details.mon-g .chev{color:var(--muted);transition:transform .2s;display:inline-block}
details.mon-g:not([open]) .chev{transform:rotate(-90deg)}
.topics{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.topics .tg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.topics .tg span{font-size:11.5px;color:var(--muted);width:64px;flex:none}
.topics button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.topics button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.cul{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 0 8px}
.cul button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0 5px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
.cul button span{font-size:19px;line-height:1.1}
.cul button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.bagbtn{border:0;background:none;color:var(--accent);font-size:12.5px;padding:2px 0;margin:0 0 6px}
.bag{border:1px dashed #C9DCEA;border-radius:12px;padding:10px;margin:0 0 10px;background:#fff}
.bag .tp{display:inline-flex;align-items:center;margin:0 5px 6px 0;border:1px solid var(--line);border-radius:999px;background:#fff}
.bag .tp button{border:0;background:none;padding:4px 10px;font-size:12.5px;color:var(--ink)}
.bag .tp .x{padding:4px 8px 4px 0;color:var(--muted);font-size:11px}
.bag .tp.done{background:#EEF6E8;border-color:#A8CB92}
.exs{font-size:13px;color:#1f4e6a;margin-top:3px;line-height:1.5}
.exs .say{font-size:15px}
.exq{font-style:normal}
.exq .en{color:#1f4e6a;font-weight:600}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span id="logo"></span><div>꿈틀나비 Q&amp;A<small>Ask · Collect · Review · Use</small></div></div>
    <div class="sync" id="sync"><i></i><span>이 기기에만 저장</span></div>
    <a class="tool" href="./" title="꿈틀나비 하루로">🦋</a>
    <button class="tool" data-act="settings" title="설정">⚙️</button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="splash"><svg width="150" height="168" viewBox="10 -4 160 180">
<g class="sp-rays"><line x1="90" y1="4" x2="90" y2="-10"/><line x1="38" y1="24" x2="28" y2="14"/><line x1="142" y1="24" x2="152" y2="14"/><line x1="22" y1="72" x2="8" y2="72"/><line x1="158" y1="72" x2="172" y2="72"/></g>
<g transform="translate(0,4)">
<g class="sp-bulb"><path d="M64 124 C64 110 36 102 36 72 A54 54 0 0 1 144 72 C144 102 116 110 116 124 Z" fill="#FFF3C2" stroke="#2B2B33" stroke-width="5.5" stroke-linejoin="round"/>
<path class="sp-lit" d="M64 124 C64 110 36 102 36 72 A54 54 0 0 1 144 72 C144 102 116 110 116 124 Z" fill="#FFD93B" stroke="#2B2B33" stroke-width="5.5" stroke-linejoin="round"/>
<rect x="62" y="124" width="56" height="30" rx="6" fill="#C9D3DD" stroke="#2B2B33" stroke-width="5.5"/><path d="M62 134 H118 M62 144 H118" stroke="#2B2B33" stroke-width="4"/><path d="M74 154 H106 V158 A8 8 0 0 1 98 166 H82 A8 8 0 0 1 74 158Z" fill="#2B2B33"/></g>
<g class="sp-l"><path d="M90 36 A36 36 0 0 0 90 108 L90 84 A8.5 8.5 0 1 0 90 66 L90 36Z" fill="#FF7A59" stroke="#2B2B33" stroke-width="4.5" stroke-linejoin="round"/><text x="71" y="82" font-size="23" text-anchor="middle" font-family="Arial" font-weight="900" fill="#2B2B33">가</text></g>
<g class="sp-r"><path d="M90 36 A36 36 0 0 1 90 108 L90 84 A8.5 8.5 0 1 0 90 66 L90 36Z" fill="#3FC1C9" stroke="#2B2B33" stroke-width="4.5" stroke-linejoin="round"/><text x="112" y="82" font-size="23" text-anchor="middle" font-family="Arial" font-weight="900" fill="#2B2B33">A</text></g>

</g></svg><div class="st"><b>꿈틀나비 Q&amp;A</b><span>Ask away!</span></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   꿈틀나비 Q&A — 영어 표현 묻고·모으고·복습하고·써먹기
   데이터: '꿈틀나비 하루 DB' 시트의 cards 탭 (하루 앱과 같은 서버)
   서버 연결 정보(kn2_cfg)는 하루 앱과 함께 씀
   ========================================================= */
const APP_VER='en-2026-11-11a';
const LS = { get(k,d,p='ke1_'){try{const v=localStorage.getItem(p+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v,p='ke1_'){try{localStorage.setItem(p+k,JSON.stringify(v))}catch(e){}} };
let cfg = LS.get('cfg',{api:'',key:''},'kn2_');
const DEMO = () => !cfg.api;

/* ---------- 도우미 ---------- */
const WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(new Date());
const label=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';};
const md=s=>s?s.slice(5).replace('-','/'):'';
let uidN=0; const uid=p=>p+Date.now().toString(36)+(uidN++%1296).toString(36).padStart(2,'0')+Math.random().toString(36).slice(2,4);   // 담은 순서대로 정렬되도록
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasKo=s=>/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u);}catch(e){}};
const sayBtn=t=>t?`<button class="say" data-act="say" data-t="${esc(t)}" title="발음 듣기">🔊</button>`:'';
const ygLink=t=>`<a class="yg" href="https://youglish.com/pronounce/${encodeURIComponent(t)}/english" target="_blank" rel="noopener">🎬 YouGlish</a>`;

const LOGO_SVG="<g transform=\"translate(0,4)\"> <path d=\"M64 124 C64 110 36 102 36 72 A54 54 0 0 1 144 72 C144 102 116 110 116 124 Z\" fill=\"#FFD93B\" stroke=\"#2B2B33\" stroke-width=\"5.5\" stroke-linejoin=\"round\"/> <path d=\"M90 36 A36 36 0 0 0 90 108 L90 84 A8.5 8.5 0 1 0 90 66 L90 36Z\" fill=\"#FF7A59\" stroke=\"#2B2B33\" stroke-width=\"4.5\" stroke-linejoin=\"round\"/> <path d=\"M90 36 A36 36 0 0 1 90 108 L90 84 A8.5 8.5 0 1 0 90 66 L90 36Z\" fill=\"#3FC1C9\" stroke=\"#2B2B33\" stroke-width=\"4.5\" stroke-linejoin=\"round\"/> <text x=\"71\" y=\"82\" font-size=\"23\" text-anchor=\"middle\" font-family=\"Arial\" font-weight=\"900\" fill=\"#2B2B33\">가</text> <text x=\"112\" y=\"82\" font-size=\"23\" text-anchor=\"middle\" font-family=\"Arial\" font-weight=\"900\" fill=\"#2B2B33\">A</text> <g transform=\"translate(138,24) rotate(18)\"><path d=\"M-13 -13 H-4 A5 5 0 1 1 4 -13 H13 V-4 A5 5 0 1 1 13 4 V13 H-13 Z\" fill=\"#7BD957\" stroke=\"#2B2B33\" stroke-width=\"4\" stroke-linejoin=\"round\"/> <text y=\"6\" font-size=\"15\" text-anchor=\"middle\" font-family=\"Arial\" font-weight=\"900\" fill=\"#2B2B33\">?</text></g> <rect x=\"62\" y=\"124\" width=\"56\" height=\"30\" rx=\"6\" fill=\"#C9D3DD\" stroke=\"#2B2B33\" stroke-width=\"5.5\"/> <path d=\"M62 134 H118 M62 144 H118\" stroke=\"#2B2B33\" stroke-width=\"4\"/> <path d=\"M74 154 H106 V158 A8 8 0 0 1 98 166 H82 A8 8 0 0 1 74 158Z\" fill=\"#2B2B33\"/> </g>";
function logo(sz){ return `<svg width="${sz}" height="${sz}" viewBox="14 6 152 168">${LOGO_SVG}</svg>`; }
document.getElementById('logo').innerHTML=logo(30);

/* ---------- 라벨·분류 ---------- */
/* type: scale 뉘앙스 저울 / brain 영어 뇌 / fit 찰떡 표현 / compass 나침반 / word 사전에서 / ''(예전 카드)
         class 수업 소재(빨간펜) / insight 통찰 — 이 둘은 선반에만, 퀴즈 제외 */
const TYPES = {
  scale:  {e:'⚖️', n:'뉘앙스 저울'},
  brain:  {e:'🧠', n:'영어 뇌'},
  fit:    {e:'🍡', n:'찰떡 표현'},
  compass:{e:'🧭', n:'나침반'},
  word:   {e:'📖', n:'사전'},
  '':     {e:'⭐', n:'예전 카드'},
  class:  {e:'🖍️', n:'수업 소재'},
  insight:{e:'🥄', n:'통찰'},
  read:   {e:'📰', n:'읽기 노트'},
  culture:{e:'👋', n:'Hi from Korea'},
};
const SHELF = t => t==='class'||t==='insight'||t==='read';
const tyOf = c => TYPES[c.type] ? c.type : '';
const CATS = ['어휘·의미','연어','문법·구조','화용','화용-공손·완곡','화용-요청·거절','화용-인사·의례','화용-맞장구·반응','화용-칭찬·사과 받기','관용·비유','문화 개념','애매함'];
const catMain = c => !c ? '' : c.startsWith('화용') ? '화용' : c;
const catTag = c => c && c!=='없음' ? `<span class="tag">${esc(c)}</span>` : '';

/* ---------- 데이터 ---------- */
const FIELDS=['id','date','ko','en','note','box','right','wrong','last','type','cat','scene','src','opts','yg','lv','due'];
function demoCards(){ const t=today(), y=addDays(t,-1); return [
  {id:'d1',date:t,type:'fit',ko:'그냥 해 본 말이야.',en:"I didn't mean anything by it.",note:'',scene:'내 말이 오해를 샀을 때 악의는 없었다고 해명하며',cat:'화용',lv:0,due:t},
  {id:'d2',date:t,type:'scale',ko:'Did you ___ the game last night?',en:'watch',opts:'look/watch/see',note:'움직이는 걸 일정 시간 지켜볼 땐 watch',cat:'어휘·의미',lv:0,due:t},
  {id:'d3',date:y,type:'compass',ko:"I'm so boring today.",en:"I'm so bored today.",note:'boring은 남을 지루하게 만드는 쪽, 내 기분은 bored',cat:'어휘·의미',lv:1,due:t,wrong:1},
  {id:'d4',date:y,type:'brain',ko:'서운하다 (가까운 사람에게)',en:'feel hurt',note:'',scene:'친구가 내 생일을 잊었을 때',cat:'어휘·의미',lv:0,due:t,yg:'1'},
  {id:'d5',date:addDays(t,-3),type:'brain',ko:'약을 먹다',en:'take medicine',note:'eat이 아니라 take',scene:'',cat:'연어',lv:2,due:addDays(t,4)},
  {id:'d6',date:y,type:'insight',ko:"남의 안 좋은 일에 왜 I'm sorry라고 할까?",en:"영어 sorry는 '사과'보다 넓게 '안타까움·유감'을 나타내요. 한국어는 사과(죄송해요)와 위로(안됐네요·속상하겠다)를 다른 말로 나눠요.",note:"영어권 학습자가 위로할 때 '죄송해요'를 쓰는 오류 → '위로 표현' 미니 레슨 소재",cat:'화용'},
  {id:'d7',date:y,type:'class',ko:'감정 형용사 -ing / -ed 혼동',en:"I'm bored. / The movie is boring.",note:'느끼는 사람은 -ed, 느끼게 하는 것은 -ing'}]; }
function norm(r){ r={...r};
  ['box','right','wrong','lv'].forEach(k=>r[k]=r[k]===''||r[k]==null?0:Number(r[k])||0);
  FIELDS.forEach(k=>{ if(!['box','right','wrong','lv'].includes(k)) r[k]=r[k]==null?'':String(r[k]); });
  return r; }
let S = { cards: (LS.get('cards',null) || (DEMO()?demoCards():[])).map(norm).filter(c=>c.type!=='log'), logs: (LS.get('logs',null) || (DEMO()?demoLogs():[])).map(norm) };
function demoLogs(){ const t=today(), L=[]; [1,2,3,5,6,8].forEach(k=>{ const d=addDays(t,-k); if(d.slice(0,7)===t.slice(0,7)) L.push({id:'log_due_'+d,type:'log',date:d,ko:'due',lv:1,box:8}); });
  [2,6].forEach(k=>{ const d=addDays(t,-k); if(d.slice(0,7)===t.slice(0,7)) L.push({id:'log_free_'+d,type:'log',date:d,ko:'free',lv:1,box:10}); }); return L; }
/* 복습 기록(하루에 한 줄씩)은 cards 탭에 type='log'로 함께 저장 — 화면의 표현 목록에는 섞이지 않게 따로 보관 */
function splitLogs(all){ S.logs=all.filter(c=>c.type==='log'); return all.filter(c=>c.type!=='log'); }
let pending = LS.get('pending',[]);
let serverOld=false, schemaOld=false;
function persist(){ LS.set('cards',S.cards); LS.set('logs',S.logs); LS.set('pending',pending); }
function opLog(row){ row=norm(row); const i=S.logs.findIndex(x=>x.id===row.id); if(i>=0) S.logs[i]=row; else S.logs.push(row);
  if(!DEMO()){ pending=pending.filter(p=>(p.row?p.row.id:p.id)!==row.id); pending.push({op:'upsert',table:'cards',row}); scheduleFlush(); } persist(); }
function logSession(kind,n){ if(!n) return; const d=today(), id=`log_${kind}_${d}`, o=S.logs.find(x=>x.id===id);
  opLog({id,type:'log',date:d,ko:kind,en:kind==='due'?'오늘의 복습':'자유 복습',lv:(o?.lv||0)+1,box:(o?.box||0)+n,last:d}); }
function endRun(){ const R=M.qz&&M.qz.run; if(!R||R.logged) return; const n=Object.keys(R.first).length; R.logged=true; logSession(R.srs?'due':'free',n); }
function op(o){
  const arr=S.cards;
  if(o.op==='upsert'){ o.row=norm(o.row); const i=arr.findIndex(x=>x.id===o.row.id); if(i>=0) arr[i]=o.row; else arr.push(o.row); }
  else { const i=arr.findIndex(x=>x.id===o.id); if(i>=0) arr.splice(i,1); }
  if(!DEMO()){ const key=(o.row?o.row.id:o.id); pending=pending.filter(p=>(p.row?p.row.id:p.id)!==key); pending.push({...o,table:'cards'}); scheduleFlush(); }
  persist();
}
const newCard = f => norm({id:uid('q_'),date:today(),box:0,right:0,wrong:0,last:'',lv:0,due:SHELF(f.type)?'':today(),...f});
let flushT=null, flushing=false;
function scheduleFlush(){ clearTimeout(flushT); flushT=setTimeout(flush,700); setSync('busy','저장 중…'); }
async function flush(){
  if(DEMO()||flushing||!pending.length) return;
  flushing=true; const batch=pending.slice();
  try{
    const res=await fetch(cfg.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,ops:batch})});
    const j=await res.json(); if(!j.ok) throw new Error(j.error||'저장 실패');
    pending=pending.filter(p=>!batch.includes(p)); persist(); setSync('ok','동기화됨');
  }catch(e){ setSync('err','오프라인 · 연결되면 저장'); }
  flushing=false; if(pending.length) setTimeout(flush,5000);
}
async function pull(){
  if(DEMO()) return;
  try{
    setSync('busy','불러오는 중…');
    if(pending.length) await flush();
    const res=await fetch(cfg.api+'?action=all&key='+encodeURIComponent(cfg.key));
    const j=await res.json(); if(!j.ok) throw new Error(j.error);
    if('cards' in j.data){
      serverOld=false; const L=j.data.cards;
      schemaOld = L.length>0 && !('type' in L[0]);
      if(schemaOld){ // 예전 Code.gs: 새 칸이 시트에 없어 이 기기 값을 지켜 둠
        const mine={}; S.cards.forEach(c=>mine[c.id]=c);
        S.cards=splitLogs(L.map(r=>norm({...(mine[r.id]||{}),...r})));
      } else S.cards=splitLogs(L.map(norm));
    } else serverOld=true;
    persist(); setSync(pending.length?'busy':'ok', pending.length?'저장 대기':'동기화됨');
    const a=document.activeElement; if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && !(M.qz&&M.qz.run)) render();
  }catch(e){ setSync('err', String(e.message||'').includes('key')?'비밀키 확인 필요':'오프라인'); }
}
function setSync(cls,txt){ const el=document.getElementById('sync'); el.className='sync '+cls; el.querySelector('span').textContent=txt; }

/* ---------- 간격 반복 ---------- */
const INT=[1,3,7,14,30,60];       // 알았음을 누를 때마다 다음 복습까지의 날 수
const DAILY_MAX=15;
const quizable = c => !SHELF(c.type) && c.lv<7;
const isDue = c => quizable(c) && (!c.due || c.due<=today());
const dueList = () => S.cards.filter(isDue).sort((a,b)=>String(a.due||a.date).localeCompare(String(b.due||b.date)));
function rate(c,r){   // r: 0 몰랐음 · 1 헷갈림 · 2 알았음 · 3 졸업
  const t=today(); let lv=c.lv, due;
  if(r===3){ lv=7; due=''; }
  else if(r===2){ due=addDays(t,INT[Math.min(lv,INT.length-1)]); lv=lv+1; if(lv>INT.length){ lv=7; due=''; } }
  else if(r===1){ due=addDays(t,1); }
  else { lv=0; due=addDays(t,1); }
  op({op:'upsert',row:{...c, lv, due, right:c.right+(r>=2?1:0), wrong:c.wrong+(r===0?1:0), box:r>=2?Math.min(3,c.box+1):0, last:t}});
}
function practice(c,ok){ op({op:'upsert',row:{...c, right:c.right+(ok?1:0), wrong:c.wrong+(ok?0:1), last:today()}}); }

/* ---------- 화면 상태 ---------- */
let M = { tab: (t=>t==='dict'?'today':t)(LS.get('tab','today')), rv:'due', lang:'en', dq:'', dres:'', dext:'', card:null, cst:'',
          lb: LS.get('lb','fit'), lq:'', ltr:'', lcard:null, lcst:'', paste:{open:false,tx:'',parsed:null},
          qz:null, st:{edit:null,q:'',ty:'all',cat:'',view:'set',openG:null,openD:null} };
const TABS=[['today','🌼','홈'],['learn','✏️','배우기'],['review','🧠','복습'],['store','🗄️','서랍장']];
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,e,n])=>`<button class="${M.tab===k?'on':''}" data-act="tab" data-v="${k}"><span>${e}</span>${n}</button>`).join('');
  const v={today:vToday,learn:vLearn,review:vReview,store:vStore}[M.tab]||vToday;
  document.getElementById('main').innerHTML = v();
}
function go(tab){ M.tab=tab; LS.set('tab',tab); render(); window.scrollTo(0,0); }

/* ---------- 🌼 오늘 ---------- */
function streak(){
  const days=new Set(); S.cards.forEach(c=>{ if(c.last) days.add(c.last); if(c.date) days.add(c.date); });
  let d=today(); if(!days.has(d)) d=addDays(d,-1); let n=0; while(days.has(d)){ n++; d=addDays(d,-1); } return n;
}
function weakMap(){
  const g={}; S.cards.filter(c=>!SHELF(c.type)&&c.cat&&c.cat!=='없음').forEach(c=>{ const k=catMain(c.cat); (g[k]=g[k]||{n:0,r:0,w:0}); g[k].n++; g[k].r+=c.right; g[k].w+=c.wrong; });
  const L=Object.entries(g).filter(([k,v])=>v.r+v.w>0).map(([k,v])=>[k,v,v.w/(v.r+v.w)]).sort((a,b)=>b[2]-a[2]);
  if(!L.length) return `<details class="card weak"><summary class="row"><b class="grow">🗺️ 나의 약점 지도</b><span class="chev">▾</span></summary><div class="muted" style="font-size:12.5px;margin-top:8px">복습 기록이 쌓이면 한·영 차이 분류별로 ‘몰랐음’ 비율이 여기에 보여요.</div></details>`;
  return `<details class="card weak"><summary class="row"><b class="grow">🗺️ 나의 약점 지도</b><span class="chev">▾</span></summary><div class="muted" style="font-size:12.5px;margin:8px 0 6px">한·영 차이 분류별로 ‘몰랐음’이 나온 비율이에요.</div><div class="bars">${L.slice(0,6).map(([k,v,p])=>`<div class="b"><span>${esc(k)}</span><div class="track"><i style="width:${Math.round(p*100)}%"></i></div><span style="width:70px;text-align:right" class="muted">${Math.round(p*100)}% · ${v.n}개</span></div>`).join('')}</div></details>`;
}
function monthCard(){
  const t=today(), ym=M.mon||t.slice(0,7), [y,m]=ym.split('-').map(Number), last=new Date(y,m,0).getDate(), first=new Date(y,m-1,1).getDay();
  const L=S.logs.filter(l=>l.date.slice(0,7)===ym), due=new Set(L.filter(l=>l.ko==='due').map(l=>l.date)), free={};
  L.filter(l=>l.ko==='free').forEach(l=>free[l.date]=l);
  const fr=Object.values(free), frN=fr.reduce((s,l)=>s+l.lv,0), frQ=fr.reduce((s,l)=>s+l.box,0);
  const isCur=ym===t.slice(0,7), passed=isCur?+t.slice(8):(ym<t.slice(0,7)?last:0);
  let cells=WD.map(w=>`<b>${w}</b>`).join('')+'<i></i>'.repeat(first);
  for(let d=1; d<=last; d++){ const ds=ym+'-'+pad(d); cells+=`<span class="${due.has(ds)?'on':''} ${free[ds]?'ring':''} ${ds===t?'today':''} ${ds>t?'fut':''}">${d}</span>`; }
  const prev=ymd(new Date(y,m-2,1)).slice(0,7), next=ymd(new Date(y,m,1)).slice(0,7);
  return `<div class="card mon"><div class="row" style="margin-bottom:6px"><button class="btn sm ghost" data-act="mon" data-v="${prev}">‹</button><h3 class="grow" style="margin:0;text-align:center">📆 ${y===+t.slice(0,4)?'':y+'년 '}${m}월 복습 기록</h3><button class="btn sm ghost" data-act="mon" data-v="${next}" ${isCur?'disabled':''}>›</button></div>
    <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:0"><div class="stat"><b>${due.size}<small style="font-size:12px;color:var(--sub)"> / ${passed}일</small></b><span>📅 오늘의 복습 한 날</span></div><div class="stat"><b>${frN}<small style="font-size:12px;color:var(--sub)">회</small></b><span>🎯 자유 복습 ${frQ?`· ${frQ}문제`:''}</span></div></div>
    <div class="cal">${cells}</div><div class="muted" style="font-size:11px;margin-top:6px;text-align:center;white-space:nowrap"><span style="color:#F2B632">●</span> 오늘의 복습 · <span style="color:#2E9E95">○</span> 자유 복습 · <u>밑줄</u> 오늘</div></div>`;
}
function vToday(){
  const t=today(), Q=quizCards();
  const due=dueList().length, nDue=Math.min(due,DAILY_MAX), nToday=S.cards.filter(c=>c.date===t).length, done=Q.filter(c=>c.last===t).length, st=streak(), grad=Q.filter(c=>c.lv>=7).length;
  const recent=[...S.cards].sort((a,b)=>String(b.date+b.id).localeCompare(String(a.date+a.id))).slice(0,4);

async function api(params,ms=20000){
  if(DEMO()) throw new Error('demo');
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms);
  let r; try{ r=await fetch(cfg.api+'?key='+encodeURIComponent(cfg.key)+'&'+new URLSearchParams(params),{signal:ac.signal}); }
  catch(e){ throw new Error(e.name==='AbortError'?'timeout':'net'); } finally{ clearTimeout(t); }
  let j; try{ j=await r.json(); }catch(e){ throw new Error('server-html'); }
  if(!j.ok) throw new Error(j.error||'fail');
  if(j.data && !('text' in j) && !('best' in j) && !('items' in j)) throw new Error('oldserver');
  return j;
}

async function enDefs(word){
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word.toLowerCase()));
  if(r.status===404) return '';
  const j=await r.json(); const e=j[0]; const ph=(e.phonetics||[]).find(p=>p.text)?.text||e.phonetic||'';
  return `<div class="ent"><b class="en">${esc(e.word)}</b> ${sayBtn(e.word)} <span class="muted">${esc(ph)}</span></div>`+e.meanings.slice(0,4).map(m=>`<div class="ent"><span class="pos">${esc(m.partOfSpeech)}</span>${m.definitions.slice(0,2).map(d=>`${esc(d.definition)}${d.example?`<div class="ex">“${esc(d.example)}”</div>`:''}`).join('<br>')}</div>`).join('');
}

async function dictSearch(){
  const q=(document.getElementById('dq')?.value||'').trim(); if(!q) return;
  M.dq=q; const lang=M.lang, ko=hasKo(q); let card=null; M.card=null; M.cst='';
  const ext=lang==='ko'?extLinks('ko',q):ko?extLinks('ko2en',q):extLinks('en',q);
  M.dres=WAIT('찾는 중…'); M.dext=ext; render();
  let body='';
  try{
    if(lang==='ko'){
      const j=await api({action:'dict',q}); if(!j.items.length) throw new Error('none');
      body=j.items.slice(0,8).map(it=>`<div class="ent"><b>${esc(String(it.word).replace(/\^/g,' ').replace(/-/g,''))}</b>${it.sup&&it.sup!=='0'?`<sup>${esc(it.sup)}</sup>`:''} ${it.pos?`<span class="pos">${esc(it.pos)}</span>`:''}<br>${esc(it.def)}</div>`).join('');
    } else if(ko){
      const j=await api({action:'tr',q,from:'ko',to:'en'});
      body=`<div class="ent big">🇬🇧 <b>${esc(j.text)}</b> ${sayBtn(j.text)}<div class="muted">‘${esc(q)}’ → 영어</div></div>`; card={ko:q,en:j.text,note:''};
      if(j.text && j.text.trim().split(/\s+/).length<=2){ try{ const d=await enDefs(j.text.trim().split(/\s+/).pop()); if(d) body+=d; }catch(e){} }
    } else {
      let err='', kt='';
      const [d,k]=await Promise.all([ enDefs(q).catch(()=>''),
        api({action:'tr',q,from:'en',to:'ko'}).then(j=>{ kt=j.text; return `<div class="ent">🇰🇷 우리말: <b>${esc(j.text)}</b></div>`; }).catch(e=>{ err=String(e.message); return ''; }) ]);
      card={ko:kt,en:q,note:''};
      if(!d&&!k) throw new Error(DEMO()?'demo':(err||'none'));
      body=k+d;
    }
  }catch(e){ body=whyMsg(String(e.message)); }
  if(M.dq!==q) return;
  M.card=card; M.dres=body; M.dext=ext; if(M.tab==='today') render();
}

/* ---------- 📋 붙여넣기 (모든 라벨 공통) ---------- */
const TYPE_WORD={'저울':'scale','뉘앙스':'scale','뇌':'brain','영어뇌':'brain','영어 뇌':'brain','찰떡':'fit','나침반':'compass','수업':'class','빨간펜':'class','통찰':'insight','소개':'culture','문답':'culture','독해':'read','읽기':'read'};
/* 라벨 이름이 조금 달라도 알아보기: '찰떡 표현', '🍡 찰떡', '[영어 뇌]', '뉘앙스 저울' 등 */
function labelOf(w){
  const n=String(w||'').replace(/[^가-힣a-zA-Z]/g,'').toLowerCase(); if(!n||n.length>8) return null;
  if(/^(뉘앙스)?저울$|^뉘앙스$/.test(n)) return 'scale';
  if(/^(영어)?뇌$/.test(n)) return 'brain';
  if(/^찰떡(표현)?$/.test(n)) return 'fit';
  if(/^나침반$/.test(n)) return 'compass';
  if(/^(독해|읽기|읽기노트|dearabby)$/.test(n)) return 'read';
  if(/^(소개|문화소개|문답|질문|hifromkorea)$/.test(n)) return 'culture';
  if(/^(수업|수업소재|빨간펜)$/.test(n)) return 'class';
  if(/^통찰(한스푼)?$/.test(n)) return 'insight';
  return null;
}
/* 라벨 없이 '우리말 :: 영어 :: 메모'로 온 줄에 붙일 라벨 (지금 고른 배우기 라벨 기준) */
const defLabel = () => ({brain:'brain',fit:'fit',abby:'fit'})[M.lb] || 'fit';
function normCat(c){ c=String(c||'').replace(/\s/g,''); if(!c) return ''; if(c==='없음') return '없음';
  const hit=CATS.find(x=>x.replace(/\s/g,'')===c); if(hit) return hit; if(c.startsWith('화용')) return '화용'; return c; }
function parseBlock(txt){
  const out=[], seen=new Set();
  String(txt).split(/\r?\n/).forEach(l=>{
    l=l.replace(/^[\s>*\-•·\d.)]+/,'').replace(/`/g,'').trim(); if(!l||!l.includes('::')) return;
    let p=l.split('::').map(x=>x.replace(/\*\*/g,'').trim());
    let yg=''; if(p.length && /^YG$/i.test(p[p.length-1])){ yg='1'; p.pop(); }
    const ty=TYPE_WORD[p[0]]||labelOf(p[0]); let c;
    if(ty){ const [,a='',b='',x='',y='',z='']=p;
      if(ty==='scale') c={type:ty,ko:a,en:b,opts:x,note:y,cat:normCat(z)};
      else if(ty==='brain'||ty==='fit') c = p.length>=6 ? {type:ty,ko:a,en:b,note:x,scene:y,cat:normCat(z)} : {type:ty,ko:a,en:b,scene:x,cat:normCat(y)};   // 새 형식: 우리말 :: 영어 :: 예문 :: 쓰임 장면 :: 분류
      else if(ty==='compass') c={type:ty,ko:a,en:b,note:x,cat:normCat(y)};
      else if(ty==='insight') c={type:ty,ko:a,en:b,note:x,cat:normCat(y)};
      else if(ty==='culture') c={type:ty,ko:a,en:b,note:x,cat:normCat(y),opts:/문답|질문|qa/i.test(p[0])?'qa':'intro'};
      else if(ty==='read') c = p.length>=6 ? {type:ty,ko:a,scene:b,en:x,opts:y,note:p.slice(5).join(' · ')} : {type:ty,ko:a,en:b,note:x};   // 새 형식: 제목 :: 처음 :: 고친 :: 모범 :: 고민
      else c={type:ty,ko:a,en:b,note:x};
    } else { let [a='',b='',x='']=p; if(!hasKo(a)&&hasKo(b)) [a,b]=[b,a]; if(/^(우리말|한국어|korean)$/i.test(a)) return; const d=M.paste.def??defLabel();
      c = d ? {type:d,ko:a,en:b,scene:x,note:p.slice(3).join(' · '),nolabel:true} : {type:'',ko:a,en:b,note:p.slice(2).join(' · ')||x,nolabel:true}; }
    if(!c.ko||!c.en) return; c.yg=yg;
    const k=(c.type+'|'+c.ko+'|'+c.en).toLowerCase(); if(seen.has(k)) return; seen.add(k);
    const same=x=>x.en.trim().toLowerCase().replace(/[.!?]+$/,'')===c.en.trim().toLowerCase().replace(/[.!?]+$/,'');
    const old=S.cards.find(x=>x.ko===c.ko && same(x)) || ((c.type==='brain'||c.type==='fit') && isEx(c.note) ? S.cards.find(x=>EXT(x.type) && same(x) && !isEx(x.note)) : null);
    c.dup=!!old; c.fill = old && (c.type==='brain'||c.type==='fit') && EXT(old.type) && isEx(c.note) && !isEx(old.note) ? old.id : '';   // 이미 있는 카드에 예문만 채우기
    c.on=!c.dup||!!c.fill; out.push(c);
  });
  const rd=out.find(c=>c.type==='read');   // 📰 같은 블록의 표현 카드에 출처 자동으로
  if(rd) out.forEach(c=>{ if(c!==rd && !SHELF(c.type) && !c.src) c.src='📰 Dear Abby · '+rd.ko; });
  const cu=out.find(c=>c.type==='culture'&&c.opts==='intro');   // 👋 같은 블록의 카드에 주제 출처 자동으로
  if(cu) out.forEach(c=>{ if(c!==cu && !SHELF(c.type) && !c.src) c.src='👋 Hi from Korea · '+cu.ko; });
  return out;
}

const SET_SIZE=25, ANCHOR='2026-01-05';   // 2주 묶음 기준 월요일

const DRAWER_TYPES=['scale','brain','fit','compass','culture','word','','read','class','insight'];
function drawersOf(ty){ const L=S.cards.filter(c=>tyOf(c)===ty).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id)); const out=[]; L.forEach((c,i)=>{ const k=Math.floor(i/SET_SIZE); (out[k]=out[k]||[]).push(c); }); return out; }
const bwStart = s => addDays(ANCHOR, Math.floor((parse(s)-parse(ANCHOR))/864e5/14)*14);
const range = L => { const d=L.map(c=>c.date).sort(); return d.length?`${md(d[0])}~${md(d[d.length-1])}`:''; };
function inPeriod(c,per){
  const t=today();
  if(per==='all') return true;
  if(per==='today') return c.date===t;
  if(per==='2w') return c.date>=addDays(t,-13);
  if(per==='month') return c.date.slice(0,7)===t.slice(0,7);
  if(per.startsWith('m:')) return c.date.slice(0,7)===per.slice(2);
  if(per.startsWith('b:')){ const a=per.slice(2); return c.date>=a && c.date<=addDays(a,13); }
  if(per.startsWith('s:')){ const [,ty,k]=per.split(':'); return (drawersOf(ty)[+k-1]||[]).some(x=>x.id===c.id); }
  return true;
}

const qzPool = (per,kind) => quizCards().filter(c=>inPeriod(c,per)&&inKind(c,kind));

function qzStart(ids,isDueRun){
  const Z=M.qz||(M.qz={per:'all',kind:'all',cnt:20,dir:'ko',run:null});

  if(!ids && !isDueRun && Z.cnt) pool=pool.slice(0,Z.cnt);
  Z.run={queue:shuffle(pool.map(c=>c.id)), i:0, first:{}, show:false, pick:null, total:pool.length, done:false, srs:!!isDueRun};
}
function qzCur(){ const R=M.qz.run; return S.cards.find(c=>c.id===R.queue[R.i]); }

  return `<div class="play">${head}${card}${ctl}</div>`;

function qzAnswer(r){   // r: 0 몰랐음 · 1 헷갈림 · 2 알았음 · 3 졸업
  const R=M.qz.run, c=qzCur(); if(!c) return;
  if(!(c.id in R.first)){ R.first[c.id]=r>=2; if(R.srs) rate(c,r); else practice(c,r>=2); }
  if(r===0) R.queue.push(c.id);
  R.i++; R.show=false; R.pick=null; R.opts=null;
  if(R.i>=R.queue.length) R.done=true;
}

  if(fn){ const b=document.createElement('button'); b.textContent=btn; b.onclick=()=>{ t.classList.remove('show','act'); toastFn&&toastFn(); toastFn=null; }; t.appendChild(b); }

    case 'saveCfg': { const a=document.getElementById('cfgApi').value.trim(), k=document.getElementById('cfgKey').value.trim();
      if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(a)){ toast('주소가 …/exec 로 끝나는지 확인해 주세요'); break; }
      cfg={api:a,key:k}; LS.set('cfg',cfg,'kn2_'); if(!LS.get('cards',null)) S.cards=[]; closeModal(); toast('연결했어요'); pull(); break; }
    case 'disconnect': cfg={api:'',key:''}; LS.set('cfg',cfg,'kn2_'); setSync('','이 기기에만 저장'); closeModal(); render(); break;
    /* 사전 */
    case 'dlang': M.lang=el.dataset.v; M.dq=document.getElementById('dq')?.value||''; M.dres=''; M.card=null; render(); if(M.dq) dictSearch(); break;
    case 'dfind': dictSearch(); break;
    case 'say': say(el.dataset.t); break;
    case 'copy': navigator.clipboard?.writeText(el.dataset.t).then(()=>toast('복사했어요'),()=>toast('복사가 막혀 있어요')); break;
    case 'cardEdit': M.cst='edit'; render(); setTimeout(()=>document.getElementById('cEn')?.focus(),50); break;
    case 'cardCancel': M.cst=''; render(); break;
    case 'cardSave': if(saveCard()){ M.cst='saved'; render(); toast('창고에 담았어요 ⭐'); } break;
    /* 배우기 */
    case 'topic': M.lq=el.dataset.v; if(el.dataset.c) M.cu=el.dataset.c; M.bag=false; render(); break;
    case 'cu': M.cu = M.cu===el.dataset.v ? '' : el.dataset.v; render(); break;
    case 'bag': M.bag=!M.bag; render(); break;
    case 'topicAdd': { const v=(document.getElementById('topicNew')?.value||'').trim(); if(!v) break; const L=myTopics().filter(x=>x.t!==v); L.push({t:v,c:M.cu||''}); saveTopics(L); render(); toast('주제를 담았어요'); break; }
    case 'topicDel': { saveTopics(myTopics().filter(x=>x.t!==el.dataset.v)); render(); break; }
    case 'lqClear': M.lq=''; M.ltr=''; M.lcard=null; M.lcst=''; render(); setTimeout(()=>document.getElementById('lq')?.focus(),50); break;
    case 'lb': if(M.lb!==el.dataset.v){ M.lq=''; } M.lb=el.dataset.v; LS.set('lb',M.lb); M.ltr=''; M.lcard=null; render(); setTimeout(()=>document.getElementById('lq')?.focus(),50); break;
    case 'fitPre': fitPreview(); break;
    case 'lcardEdit': M.lcst='edit'; render(); break;
    case 'lcardCancel': M.lcst=''; render(); break;
    case 'lcardSave': if(saveCard()){ M.lcst='saved'; render(); toast('찰떡 카드로 담았어요 ⭐'); } break;
    case 'pasteOpen': M.paste={open:true,tx:'',parsed:null}; render(); setTimeout(()=>document.getElementById('pasteTx')?.focus(),50); break;
    case 'pClose': M.paste={open:false,tx:'',parsed:null}; render(); break;
    case 'pClip': { const done=t=>{ M.paste.tx=t; M.paste.parsed=parseBlock(t); render(); };
      if(navigator.clipboard?.readText) navigator.clipboard.readText().then(done,()=>{ toast('길게 눌러 붙여넣기 해 주세요'); document.getElementById('pasteTx')?.focus(); });
      else { toast('길게 눌러 붙여넣기 해 주세요'); document.getElementById('pasteTx')?.focus(); } break; }
    case 'pParse': { const t=document.getElementById('pasteTx')?.value||''; M.paste.tx=t; M.paste.parsed=parseBlock(t); render(); break; }
    case 'pSave': { const P=(M.paste.parsed||[]).filter(c=>c.on);
      const cu=M.paste.cu??M.cu??'';
      P.forEach(({dup,on,nolabel,fill,...c})=>{ if(fill){ const o=S.cards.find(x=>x.id===fill); if(o) op({op:'upsert',row:{...o,note:c.note,scene:o.scene||(o.note&&!isEx(o.note)?o.note:'')||c.scene||''}}); return; } if(c.type==='culture') c.scene=cu; op({op:'upsert',row:newCard(c)}); });
      const newT=P.filter(c=>c.type==='culture'&&c.opts!=='qa').map(c=>c.ko.trim()).filter(Boolean);
      if(newT.length){ const L=myTopics(); let ch=false; newT.forEach(t=>{ const i=L.findIndex(x=>x.t===t), inBase=BAG0.some(([b])=>b===t);
        if(i>=0){ if(cu && L[i].c!==cu){ L[i].c=cu; ch=true; } } else if(!inBase){ L.push({t,c:cu}); ch=true; } }); if(ch) saveTopics(L); }
      const nf=P.filter(c=>c.fill).length, nq=P.filter(c=>!SHELF(c.type)&&!c.fill).length, ns=P.length-nq-nf;
      M.paste={open:false,tx:'',parsed:null}; if(P.length){ M.lq=''; M.ltr=''; M.lcard=null; M.lcst=''; } render(); { const a=[nq?`퀴즈 카드 ${nq}개`:'',ns?`선반 ${ns}개`:''].filter(Boolean).join(' · '); toast([a?a+'를 담았어요':'',nf?`예문 ${nf}개를 채웠어요`:''].filter(Boolean).join(' · ')); } break; }
    /* 복습 */
    case 'dueStart': M.rv='due'; qzStart(null,true); go('review'); break;
    case 'qzPer': M.qz.per=el.dataset.v; render(); break;
    case 'qzKind': M.qz.kind=el.dataset.v; render(); break;
    case 'qzCnt': M.qz.cnt=+el.dataset.v; render(); break;
    case 'qzDir': M.qz.dir=el.dataset.v; render(); break;
    case 'qzStart': qzStart(); render(); break;
    case 'qzFlip': M.qz.run.show=true; render(); break;
    case 'rate': qzAnswer(+el.dataset.v); render(); break;
    case 'qzPick': { const R=M.qz.run, c=qzCur(), k=+el.dataset.k; R.pick=k; const right=R.opts.list[k]===c.en;
      if(!(c.id in R.first)){ R.first[c.id]=right; if(R.srs) rate(c,right?2:0); else practice(c,right); }
      if(!right) R.queue.push(c.id); render(); break; }
    case 'qzNext': { const R=M.qz.run; R.i++; R.pick=null; R.opts=null; if(R.i>=R.queue.length) R.done=true; render(); break; }
    case 'qzQuit': case 'qzHome': endRun(); M.qz.run=null; render(); break;
    case 'qzRetry': { endRun(); const R=M.qz.run; const miss=Object.keys(R.first).filter(k=>!R.first[k]); qzStart(miss,false); render(); break; }
    /* 창고 */
    case 'stTy': M.st.ty=el.dataset.v; M.st.cu=''; render(); break;
    case 'stView': M.st.view=el.dataset.v; render(); break;
    case 'stCu': M.st.cu=el.dataset.v; render(); break;
    case 'stCuGo': M.st.view='list'; M.st.ty='culture'; M.st.cu=el.dataset.v; render(); window.scrollTo(0,0); break;
    case 'stMore': { const ym=el.dataset.v; M.st.more=M.st.more||{}; M.st.more[ym]=((M.st.more[ym])||20)+20; M.st.openM=ym; render(); break; }
    case 'setPractice': { if(!M.qz) M.qz={per:'all',kind:'all',cnt:20,dir:'ko',run:null}; M.qz.per='s:'+el.dataset.v; M.qz.kind='all'; M.qz.cnt=0; M.qz.run=null; M.rv='free'; go('review'); break; }
    case 'rv': M.rv=el.dataset.v; render(); break;
    case 'mon': M.mon=el.dataset.v; render(); break;
    case 'goFree': M.rv='free'; if(M.qz) M.qz.run=null; go('review'); break;
    case 'goLabel': if(M.lb!==el.dataset.v){ M.lq=''; } M.lb=el.dataset.v; LS.set('lb',M.lb); M.ltr=''; M.lcard=null; go('learn'); setTimeout(()=>document.getElementById('lq')?.focus(),80); break;
    case 'stAdd': M.st.edit='new'; M.st.newTy=['class','insight','scale','compass','fit','brain','word',''].includes(M.st.ty)?M.st.ty:'brain'; render(); setTimeout(()=>document.getElementById('cKo')?.focus(),50); break;
    case 'stCancel': M.st.edit=null; render(); break;
    case 'stEdit': M.st.edit=id; render(); break;
    case 'stAddSave': if(saveCard()){ M.st.edit=null; render(); toast('담았어요 ⭐'); } break;
    case 'stEditSave': { const c=S.cards.find(x=>x.id===id); if(c&&saveCard(c)){ M.st.edit=null; render(); toast('고쳤어요'); } break; }
    case 'stDel': { const c=S.cards.find(x=>x.id===id); if(!c) break; op({op:'delete',id}); render();
      toast('지웠어요','되돌리기',()=>{ op({op:'upsert',row:c}); render(); }); break; }
  }
  const after=cnt();
  for(const t in after){ const k=Math.floor(after[t]/SET_SIZE); if(k>Math.floor((before[t]||0)/SET_SIZE)){ setTimeout(()=>toast(`🗄️ ${TYPES[t].n} 서랍 ${k}이 꽉 찼어요! 🌼`),400); break; } }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(!d.matches) return; if(d.matches('details.cab')) M.st.openG=d.open?d.dataset.ty:(M.st.openG===d.dataset.ty?null:M.st.openG); if(d.matches('details.mon-g') && !M.st.q.trim()) M.st.openM=d.open?d.dataset.ym:((M.st.openM===d.dataset.ym||M.st.openM==null)?'-':M.st.openM); if(d.matches('details.drawer')) M.st.openD=d.open?d.dataset.key:(M.st.openD===d.dataset.key?null:M.st.openD); },true);
document.addEventListener('change',e=>{
  if(e.target.matches('[data-pi]')){ const P=M.paste.parsed; P[+e.target.dataset.pi].on=e.target.checked; M.paste.tx=document.getElementById('pasteTx')?.value||M.paste.tx; render(); }
  if(e.target.id==='pCu'){ M.paste.cu=e.target.value; return; }
  if(e.target.id==='pDef'){ M.paste.def=e.target.value; M.paste.tx=document.getElementById('pasteTx')?.value||M.paste.tx; M.paste.parsed=parseBlock(M.paste.tx); render(); return; }
  if(e.target.id==='stCat'){ M.st.cat=e.target.value; render(); }
  if(e.target.id==='perSel' && e.target.value){ M.qz.per=e.target.value; M.qz.kind=qzPool(M.qz.per,M.qz.kind).length?M.qz.kind:'all'; render(); }
  if(e.target.id==='cTy'){   // 라벨을 바꾸면 입력 칸 이름도 바뀜
    const box=e.target.closest('.cardbox'); const f=readCardForm(); const act=box.querySelector('.btn.pri').dataset.act, id=box.querySelector('.btn.pri').dataset.id;
    const base=id?{...S.cards.find(x=>x.id===id),...f}:f; box.innerHTML=(box.querySelector('b')?box.querySelector('b').outerHTML:'')+cardForm(base,act,id);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='stQ'){ M.st.q=e.target.value; const q=M.st.q.trim().toLowerCase(); document.querySelectorAll('.crow[data-s]').forEach(r=>r.style.display=(q? r.dataset.s.includes(q) : !r.dataset.x)?'':'none'); document.querySelectorAll('.more-btn').forEach(b=>b.style.display=q?'none':'');
    document.querySelectorAll('details.mon-g').forEach(g=>{ const all=g.querySelectorAll('.crow[data-s]').length, hit=[...g.querySelectorAll('.crow[data-s]')].filter(r=>r.style.display!=='none').length;
      g.style.display=q&&!hit?'none':''; if(q) g.open=hit>0; else g.open=(M.st.openM? M.st.openM===g.dataset.ym : g===document.querySelector('details.mon-g'));
      const mc=g.querySelector('.mcount'); if(mc) mc.textContent=(q?hit+' / ':'')+all+'개'; }); }
  if(e.target.id==='dq') M.dq=e.target.value;
  if(e.target.id==='lq'){ M.lq=e.target.value; const L=LABELS[M.lb], a=document.getElementById('askGo'), q=M.lq.trim();
    if(a){ a.href=q?askURL(L.p(q)):'#'; a.style.opacity=q?'':'.45'; a.style.pointerEvents=q?'':'none'; }
    const fp=document.querySelector('[data-act=fitPre]'); if(fp) fp.disabled=!q; const cl=document.querySelector('[data-act=lqClear]'); if(cl) cl.disabled=!q; }
  if(e.target.id==='pasteTx') M.paste.tx=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='topicNew' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); document.querySelector('[data-act=topicAdd]')?.click(); }
  if(e.target.id==='dq' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); dictSearch(); }
  if(['cKo','cEn','cNote','cScene','cSrc','cOpts'].includes(e.target.id) && e.target.tagName!=='TEXTAREA' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); document.querySelector('[data-act=cardSave],[data-act=lcardSave],[data-act=stAddSave],[data-act=stEditSave]')?.click(); }
});

/* ---------- 시작 ---------- */
(function splash(){ const el=document.getElementById('splash'); if(!el) return; let done=false;
  const finish=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),500); };
  el.addEventListener('click',finish); setTimeout(finish,2900); })();
render();
if(!DEMO()){ setSync('busy','불러오는 중…'); pull(); setInterval(()=>{ if(document.visibilityState==='visible') pull(); },60000); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); });
</script>
</body>
</html>
