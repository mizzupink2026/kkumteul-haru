<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24555C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꿈틀나비 하루">
<title>꿈틀나비 하루 — 국화를 피우는 습관 기록장</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2b2824; --sub:#7a7268; --line:#e9e1d3;
  --accent:#3d6b4f; --accent-soft:#e4eee6; --gold:#e8a33d; --gold-soft:#fcf0d8; --warm:#d9733f; --good:#3d8a5c;
  --r:16px; --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ── 미리보기 바(데모 모드에서만) ── */
.pv{display:none;position:sticky;top:0;z-index:50;background:#2b2824;color:#fff;padding:8px 12px;gap:8px;align-items:center;justify-content:center;font-size:13px;flex-wrap:wrap}
body.demo .pv{display:flex}
.pv b{font-weight:500;opacity:.8;margin-right:4px}
.pv button{background:#ffffff1a;border:1px solid #ffffff33;border-radius:999px;padding:5px 14px;color:#fff}
.pv button.on{background:#fff;color:#2b2824}
body.mobile .stage{padding:24px 12px 40px}
.frame{margin:0 auto;max-width:1200px;min-height:100vh}
body.mobile .frame{width:390px;max-width:100%;height:800px;min-height:0;overflow:auto;border-radius:34px;border:10px solid #1f1d1b;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.25)}

/* ── 앱 골격 ── */
.app{container:app/inline-size}
.shell{display:flex;flex-direction:column;min-height:100%}
body.mobile .shell{min-height:780px}
body{--pvh:0px} body.demo:not(.mobile){--pvh:41px}
@media (max-width:599px){ body.demo .pv{display:none} body.demo:not(.mobile){--pvh:0px} }
header.top{padding:14px 14px 8px 18px;display:flex;align-items:center;gap:8px;position:sticky;top:var(--pvh);z-index:30;background:rgba(247,243,234,.94);backdrop-filter:blur(8px)}
.tool{border:1px solid var(--line);background:var(--card);border-radius:12px;height:36px;min-width:36px;padding:0 9px;display:flex;align-items:center;gap:5px;font-size:16px}
.tool em{display:none;font-style:normal;font-size:13px}
.brand{font-family:"Gowun Batang",serif;font-size:21px;font-weight:700;display:flex;align-items:center;gap:6px;flex:1;line-height:1.1}
.brand #brandIco{display:flex;margin:-6px -2px -6px -6px}
.empick{font-size:20px;padding:4px 0;cursor:pointer;background:#fff;width:42px!important;flex:none;height:40px}
.set-row .btn{white-space:nowrap}
button.icoprev{border:1px solid var(--line);border-radius:10px;background:#fff;height:40px;padding:0;cursor:pointer}
.emgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emgrid button{font-size:22px;border:1px solid transparent;background:none;border-radius:10px;padding:6px 0}
.emgrid button:hover,.emgrid button.on{background:var(--gold-soft);border-color:#f1dfb8}
.icoprev{display:flex;align-items:center;justify-content:center;width:42px;flex:none}
.cat-h svg,.opts svg,.vote svg,.dock h4 svg,.grid7 svg{vertical-align:-0.25em}
.brand small{white-space:nowrap;display:block;font-family:"Nunito",sans-serif;font-style:normal;font-weight:600;font-size:11.5px;color:var(--sub);margin-top:2px}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync span{white-space:nowrap}
@media (max-width:420px){ .sync span{display:none} }
.sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--gold)} .sync.err i{background:var(--warm)}
nav.tabs{display:flex;gap:4px;position:sticky;bottom:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));order:9}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0;border-radius:12px;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button em{display:none}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
main{flex:1;padding:4px 14px 20px}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-weight:400;font-size:12px}
.muted{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn.danger{color:#b4472e;border-color:#f0cfc4}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.pagehead{margin:4px 0 12px}
.pagehead h2{margin:0;font-family:"Gowun Batang",serif;font-size:20px}
.pagehead p{margin:3px 0 0;color:var(--sub);font-size:13px}

.datebar{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:17px}
.datebar .d small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px}

/* 오늘 — 국화 */
.hero{display:flex;align-items:center;gap:14px}
.bloom{position:relative;flex:none;text-align:center}
.bloom svg{width:92px;height:92px}
.hero .msg{font-size:13.5px}
.bloom .pct{font-weight:700;font-size:20px;margin-top:-6px}
.bloom .pct small{font-size:12px;font-weight:400}
.hero .msg{font-size:14px;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
.chip.gold{background:var(--gold-soft);color:#9a6512}
.flower .p{transition:fill .35s}
.flower.full{filter:drop-shadow(0 0 5px rgba(255,214,10,.55))}

/* 이번 주의 문장 */
.quote{background:linear-gradient(135deg,#fffaf0,#fcf0d8);border:1px solid #f1dfb8}
.q-pc{display:none}
.quote .en{font-family:"Nunito",sans-serif;font-style:normal;font-weight:600;font-size:16px;line-height:1.55;margin:2px 0 6px}
.quote .by{font-size:12px;color:#9a6512}
.quote details{margin-top:8px;font-size:13px;line-height:1.6}
.quote summary{cursor:pointer;color:var(--sub);font-size:12.5px;list-style:none}
.quote summary::-webkit-details-marker{display:none}
.quote .ko{font-size:13px;color:#6e5a3c;line-height:1.55;margin:0 0 4px}
.quote .qh{font-family:"Nunito",sans-serif;font-weight:800;letter-spacing:.02em}

/* 할 일 목록 */
.cat{margin-bottom:10px}
.cat-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;color:#1f1c19;margin:0 2px 2px;letter-spacing:-.01em}
.cat-h .bar{flex:1;height:9px;border-radius:6px;background:#e4d9c6;overflow:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.06)}
.cat-h .bar i{display:block;height:100%;border-radius:5px}
.cat-h .n{font-size:12.5px;color:#4a443d;font-weight:700}
.catadd{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--accent);font-size:15px;line-height:1;padding:0;flex:none}
.ident{font-family:"Gowun Batang",serif;font-size:12.5px;color:var(--sub);margin:0 2px 7px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ident .lks{display:flex;gap:4px;flex-wrap:wrap}
.ident .lks a,.ident .lks button{font-family:"Noto Sans KR",system-ui,sans-serif;font-size:11.5px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 10px;margin-bottom:4px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item .grip{color:#c9bfb0;font-size:13px;letter-spacing:-2px;flex:none;cursor:grab;display:none}
@media (hover:hover){ main .item{cursor:grab} main .item:hover .grip{display:block} }
.item.dragging{cursor:grabbing;box-shadow:0 10px 26px rgba(40,30,20,.25);transform:scale(1.02);z-index:200;opacity:.97;transition:none}
.drop-ph{border:2px dashed #cdbfa8;border-radius:12px;margin-bottom:4px;background:#fbf6ec}
.item.done{background:#f6f9f4}
.item.done .t{color:var(--sub);text-decoration:line-through;text-decoration-color:#a9c3ae}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--c,#999);background:none;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;padding:0}
.item.done .check{background:var(--c,#999)}
.item .t{flex:1;min-width:0;line-height:1.3;font-size:14px}
.item .t small{display:inline;font-size:11px;color:var(--sub);margin-left:6px}
.counter{display:flex;align-items:center;gap:4px;flex:none}
.counter button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0;font-size:16px}
.counter b{min-width:46px;text-align:center;font-size:12.5px}
.mini{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c,#999)}
.open{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 7px;white-space:nowrap;background:#fff;color:var(--ink)}
.edit{border:0;background:none;color:#b8afa5;font-size:16px;padding:2px 4px}
.add{width:100%;border:1.5px dashed #d8cdbb;background:none;border-radius:14px;padding:11px;color:var(--sub)}
.empty{text-align:center;padding:26px 10px;color:var(--sub);font-size:14px}

/* 일정 */
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-size:12.5px;font-weight:700;color:var(--accent);min-width:44px;padding-top:2px}
.ev .tt{flex:1;font-size:14px;line-height:1.4}
.ev .tt small{display:block;color:var(--sub);font-size:12px}
.ev.done .tt{color:var(--sub);text-decoration:line-through}
.evck{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:none;padding:0;flex:none;color:#fff;font-size:12px}
.ev.done .evck{background:var(--accent)}
.dayhead{font-size:13px;font-weight:700;margin:14px 2px 4px;color:var(--sub)}
.dayhead.today{color:var(--warm)}

/* 바로 열기 */
.dock h4{margin:10px 0 6px;font-size:12.5px;color:var(--sub);font-weight:500}
.dock h4:first-of-type{margin-top:0}
.links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lk{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px;font-size:12.5px;line-height:1.3;text-align:left}
.lk span{font-size:18px}

/* 꽃밭(기록) */
.seg{display:flex;background:#ece4d6;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.garden{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.garden .g{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:4px 0;border-radius:10px}
.garden .g b{font-size:11.5px;font-weight:500;color:var(--sub)}
.garden .g span{font-size:12px}
.garden .g.today span{color:var(--warm);font-weight:700}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11.5px;color:var(--sub)}
.vote{margin:10px 0}
.vote .l{display:flex;align-items:baseline;gap:6px;font-size:13px;margin-bottom:4px}
.vote .l .i{font-family:"Gowun Batang",serif;flex:1}
.vote .l b{font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap}
.vote .tr{height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.vote .tr i{display:block;height:100%;border-radius:6px}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .nm{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px}
.hbar .v{width:40px;text-align:right;color:var(--sub);font-size:12px}
.grid7{width:100%;border-collapse:collapse;font-size:12.5px}
.grid7 th{font-weight:400;color:var(--sub);font-size:11.5px;padding:4px 0}
.grid7 td{padding:5px 2px;text-align:center}
.grid7 td.nm{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;background:#ede6da;vertical-align:middle}
.dot.part{opacity:.45}
.dot.na{background:none;border:1px dashed #e2dbd0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:11.5px;color:var(--sub);text-align:center;padding-bottom:2px}
.cal .c{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;background:none;border:0;padding:3px 0 2px;color:var(--sub);line-height:1}
.cal .c svg{display:block}
.cal .c.blank{visibility:hidden}
.cal .c.today{background:var(--gold-soft);color:#9a6512;font-weight:700}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);justify-content:flex-end;margin-top:8px}
.insight{background:var(--gold-soft);border:1px solid #f1dfb8;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}

/* 가꾸기(설정) */
.set-row{display:flex;align-items:center;gap:6px;padding:8px 0 4px}
.set-row input.em{width:42px;text-align:center;flex:none}
.set-block{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.set-block:last-of-type{border-bottom:0}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.inp.id{font-family:"Gowun Batang",serif;font-size:13.5px}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0 48px}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.days{display:flex;gap:4px}
.days button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 0;font-size:13px}
.days button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 여는 화면 */
#splash{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 38%,#fffaf0,#f7f0e1);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash .st{text-align:center;opacity:0;transform:translateY(8px);transition:.5s;margin-top:-6px}
#splash.txt .st{opacity:1;transform:none}
#splash .st b{display:block;font-family:"Gowun Batang",serif;font-size:24px}
#splash .st span{font-family:"Nunito",sans-serif;font-weight:700;color:#c24d7e;font-size:15px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(30,25,20,.42);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
body.mobile .sheet{max-width:390px}
.sheet h2{margin:0 0 14px;font-size:17px}
.shead{display:flex;align-items:center;gap:6px;position:sticky;top:-18px;margin:-18px -18px 12px;padding:12px 12px 10px;background:var(--card);border-bottom:1px solid var(--line);z-index:2}
.shead h2{margin:0;flex:1;text-align:center;font-size:16px}
.modal.form{align-items:flex-start;padding-top:max(10px,env(safe-area-inset-top))}
.modal.form .sheet{border-radius:20px;max-height:calc(100vh - 20px)}
.toast{position:fixed;left:50%;bottom:175px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:120;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.toast button{margin-left:10px;background:none;border:0;color:#ffd60a;font-weight:700;padding:0}
.toast.act{pointer-events:auto}
/* 메모 칸: 휴대폰=하단 고정 막대(펼침 가능), PC=왼쪽 사이드바 */
.side{display:contents}
.memo{order:8;position:sticky;bottom:62px;z-index:19;background:rgba(255,253,248,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 12px 6px;box-shadow:0 -4px 14px rgba(60,40,20,.05)}
.memo .mh{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.memo .mh .muted{flex:1;font-size:11.5px}
.mtog{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 4px}
.memo .min{display:flex;gap:6px;align-items:flex-end}
.memo .min textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;resize:none;line-height:1.4;min-height:38px;max-height:120px;font-size:14px}
.memo .list,.memo .mfoot{display:none}
.memo.open .list{display:block;max-height:38vh;overflow:auto;margin-top:6px}
.memo.open .mfoot{display:flex;gap:6px;justify-content:flex-end;padding:6px 0 2px}
.mm .mc{width:20px;height:20px;border-radius:50%;border:1.6px solid #c9bda8;background:none;padding:0;flex:none;margin-top:2px;font-size:11px;color:#fff}
.mm.done .mc{background:#b9ae9c;border-color:#b9ae9c}
.mm.done .tx{color:#a39a8d;text-decoration:line-through;text-decoration-color:#8d8478}
.mrow{display:flex;gap:6px;align-items:center;margin:6px 0 4px}
.mm{display:flex;gap:8px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line)}
.mm:last-child{border-bottom:0}
.mm .tx{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.mm .tx small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.mm .x{border:0;background:none;color:#b8afa5;font-size:15px;padding:2px 6px}

<script>
/* =========================================================

function softPetal(w,L){

}

function chrysHead(cx,cy,R,pal,detail){
  let s=`<g transform="translate(${f2(cx)} ${f2(cy)}) scale(${f2(R/36)} ${f2(R/36*0.92)})">`;
  RINGS.forEach(([n,b,L,w],ri)=>{ const off=ri%2?180/n:0;
    for(let i=0;i<n;i++) s+=`<g transform="rotate(${f2(i*360/n+off)}) translate(0 ${-b})"><path d="${petalPath(w,L)}" fill="${pal.f[ri]}" stroke="${pal.s}" stroke-opacity=".45" stroke-width="${detail?0.8:1}"/></g>`;
  });
  return s+`<circle r="3.2" fill="${pal.f[4]}"/></g>`;
}
function chrysLeaf(x,y,rot,sc,c1,c2){ // 가장자리가 둥글게 갈라진 국화 잎
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><path d="M0 0 C3 -8 10 -12 15 -10 C16 -16 23 -18 27 -13 C30 -18 37 -17 39 -11 C44 -12 48 -7 46 -2 C50 0 50 5 46 6 C48 11 43 14 39 12 C37 18 30 18 27 14 C24 19 17 18 15 13 C9 15 3 10 0 0Z" fill="${c1}"/><path d="M1 0 C14 0 30 0 47 2" stroke="${c2}" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>`;
}
function flower(fr,size){
  const none=!(fr&&fr.length), list=none?[0,0,0,0,0,0,0,0]:[...fr].sort((a,b)=>b-a), N=list.length;
  const all=!none&&list.every(x=>x>=1), cy=44, R0=9.5, L=33, vein=size>=60;
  const w=Math.max(3,Math.min(N<=8?12.5:10.5,(Math.PI*2*(R0+L/2))/N*0.45));
  let s=`<svg class="flower ${all?'full':''}" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">`;
  s+=`<path d="M50 80 C40 90 26 92 17 86 C28 77 40 77 50 80Z" fill="var(--pri)" opacity=".75"/><path d="M50 80 C60 90 74 92 83 86 C72 77 60 77 50 80Z" fill="var(--pri)"/>`;
  for(let i=0;i<N;i++){
    const v=list[i], on=!none&&v>0, op=v>=1?1:0.3+0.4*v;
    s+=`<g transform="translate(50 ${cy}) rotate(${f2(i*360/N)}) translate(0 ${f2(-R0+3)})"><path d="${softPetal(w,L)}" fill="${on?'var(--hi)':'var(--track)'}" fill-opacity="${on?op:1}" stroke="${v>=1?'var(--hi-ink)':'var(--line)'}" stroke-opacity="${v>=1?.35:1}" stroke-width="0.9" stroke-linejoin="round"/>`;

    s+='</g>';
  }
  if(all){ s+=`<circle cx="50" cy="${cy}" r="${R0}" fill="var(--hi-ink)"/>`; [[-3,-3],[3,-2],[0,3],[-4,2],[4,3]].forEach(([x,y])=>s+=`<circle cx="${50+x}" cy="${cy+y}" r="1.3" fill="var(--hi)"/>`); }

  return s+'</svg>';
}

/* ---------- 정규화(시트에서 온 문자열 → 숫자/배열) ---------- */
function norm(table,row){
  const r={...row};
  (NUM[table]||[]).forEach(k=>{ r[k]= r[k]===''||r[k]==null ? (k==='target'?1:0) : Number(r[k]); });
  if(table==='routines') r.days = Array.isArray(r.days)? r.days.map(Number) : String(r.days??'').split(',').filter(x=>x!=='').map(Number);
  if(table==='events'||table==='memos') r.done = r.done===true||r.done==='TRUE'||r.done==='true';
  ['date','start','end','time','catId','identity','linkId'].forEach(k=>{ if(k in r) r[k]=r[k]==null?'':String(r[k]); });
  return r;
}
function normAll(d){ const o={}; TABLES.forEach(t=>o[t]=(d[t]||[]).map(r=>norm(t,r))); return o; }

/* ---------- 저장·동기화 ---------- */
function persist(){ LS.set('data',S); LS.set('pending',pending); }
function op(o){
  const arr=S[o.table];
  if(o.op==='upsert'){ const i=arr.findIndex(x=>x.id===o.row.id); if(i>=0) arr[i]=o.row; else arr.push(o.row); }
  else { const i=arr.findIndex(x=>x.id===o.id); if(i>=0) arr.splice(i,1); }
  if(!DEMO()){
    const key=o.table+'|'+(o.row?o.row.id:o.id);
    pending=pending.filter(p=>p.table+'|'+(p.row?p.row.id:p.id)!==key);
    pending.push(o); scheduleFlush();
  }
  persist();
}
let flushT=null, flushing=false;
function scheduleFlush(){ clearTimeout(flushT); flushT=setTimeout(flush,700); setSync('busy','저장 중…'); }
async function flush(){
  if(DEMO()||flushing||!pending.length) return;
  flushing=true; const batch=pending.slice();
  try{
    const res=await fetch(cfg.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:cfg.key,ops:batch.map(p=>p.row?{...p,row:{...p.row,days:Array.isArray(p.row.days)?p.row.days.join(','):p.row.days}}:p)})});
    const j=await res.json(); if(!j.ok) throw new Error(j.error||'저장 실패');
    pending=pending.filter(p=>!batch.includes(p)); persist();
    setSync('ok','동기화됨');
  }catch(e){ setSync('err','오프라인 · 연결되면 저장'); }
  flushing=false; if(pending.length) setTimeout(flush,5000);
}
async function pull(){
  if(DEMO()) return;
  try{
    setSync('busy','불러오는 중…');
    if(pending.length) await flush();
    const res=await fetch(cfg.api+'?action=all&key='+encodeURIComponent(cfg.key));
    const j=await res.json(); if(!j.ok) throw new Error(j.error);
    if(j.quote!==undefined){ QOD=j.quote; LS.set('qod',QOD); }
    S=normAll(j.data); persist(); setSync(pending.length?'busy':'ok', pending.length?'저장 대기':'동기화됨'); render(); renderMemo();
  }catch(e){ setSync('err', String(e.message||'').includes('key')?'비밀키 확인 필요':'오프라인'); }
}
function setSync(cls,txt){ const el=document.getElementById('sync'); el.className='sync '+cls; el.querySelector('span').textContent=txt; }

/* ---------- 계산 ---------- */
const cats = () => [...S.categories].sort((a,b)=>a.order-b.order);
const catOf = id => S.categories.find(c=>c.id===id) || {id:'',name:'기타',emoji:'📌',identity:'',color:'#999',order:99};
const linkOf = id => S.links.find(l=>l.id===id);
function itemsFor(date){
  const wd=parse(date).getDay();
  const rs=S.routines.filter(r=>r.days.includes(wd) && (!r.start||r.start<=date) && (!r.end||r.end>=date)).map(r=>({...r,src:'routine'}));
  const ts=S.tasks.filter(t=>t.date===date).map(t=>({...t,src:'task'}));
  const ord=x=>x.order||(x.src==='task'?1e6:1e5);
  return rs.concat(ts).sort((a,b)=>ord(a)-ord(b));
}
const logVal = (date,id) => { const l=S.logs.find(x=>x.id===date+'|'+id); return l?Number(l.value)||0:0; };
const frac = (date,it) => Math.min(1, logVal(date,it.id)/(it.target||1));
function dayPct(date){ const its=itemsFor(date); if(!its.length) return null; return its.reduce((s,it)=>s+frac(date,it),0)/its.length; }
function streak(){
  let n=0, d=today(); const p=dayPct(d);
  if(p===null||p<0.8) d=addDays(d,-1);
  for(let i=0;i<400;i++){ const q=dayPct(d); if(q===null){ d=addDays(d,-1); continue; } if(q>=0.8){n++; d=addDays(d,-1);} else break; }
  return n;
}

function cheer(p,left){
  if(p===null) return '이 날은 계획이 없어요.<br>아래에서 씨앗 하나를 심어 볼까요?';
  if(p>=0.999) return '꽃잎이 모두 채워지고 꽃술까지 피었어요! 🌼<br>오늘 치 표를 모두 던졌어요.';
  if(p>=0.8) return `거의 다 피었어요. 남은 꽃잎은 <b>${left}장</b>!`;
  if(p>=0.4) return '꽃잎이 절반쯤 채워졌어요.<br>가장 쉬운 것 하나부터 끝내 볼까요?';
  if(p>0) return '첫 꽃잎이 채워졌어요.<br>작은 체크 하나도 한 표예요.';
  return `오늘의 꽃잎 ${left}장이 채워지길 기다리고 있어요. 🌱`;
}

function dockCard(){
  const L=[...S.links].sort((a,b)=>a.order-b.order); if(!L.length) return '';

/* 동그라미 조각: 습관 하나 = 한 조각 (다 하면 진하게, 반쯤 하면 옅게) */
function rings(fr){
  const n=fr.length, r=25, cx=28, gap=n>1?14:0;
  if(!n) return `<svg class="rg" viewBox="0 0 56 56"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--track)" stroke-width="4.5"/></svg>`;
  const p=a=>[cx+r*Math.cos(a*Math.PI/180),cx+r*Math.sin(a*Math.PI/180)];
  let o=''; [...fr].sort((a,b)=>b-a).forEach((v,k)=>{ const col=v>0?'var(--cc)':'var(--track)', op=v>=1?1:v>0?.45:1;
    if(n===1){ o+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="4.5"/>`; return; }
    const a0=-90+k*360/n+gap/2, a1=-90+(k+1)*360/n-gap/2, [x0,y0]=p(a0), [x1,y1]=p(a1);
    o+=`<path d="M${f2(x0)} ${f2(y0)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f2(x1)} ${f2(y1)}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="4.5" stroke-linecap="round"/>`; });
  return `<svg class="rg" viewBox="0 0 56 56">${o}</svg>`;
}

  const s=ui.sheet; if(!s) return; let h='';
  const head=(ic,t)=>`<div class="grab"></div><div class="shh">${ic}<b>${t}</b><button class="x" data-act="close" aria-label="닫기">${I('x')}</button></div>`;
  if(s.t==='sched'){ const d=ui.date, evs=S.events.filter(e=>e.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    h=head(`<span style="color:var(--pri)">${I('clock')}</span>`,(d===today()?'오늘 ':label(d)+' ')+'일정')

      +`<button class="add" style="margin-top:10px" data-act="newEvent">${I('plus')} 일정 심기</button>`; }
  if(s.t==='urg'){ const L=[...S.memos].sort((a,b)=>String(b.created).localeCompare(String(a.created))), left=L.filter(m=>!m.done), done=L.filter(m=>m.done);

    h=head(`<span style="color:var(--hi-ink)">${I('alert')}</span>`,'긴급')
      +`<div class="urgin"><textarea id="urgIn" rows="1" placeholder="급한 일을 적어요"></textarea><button class="btn pri" data-act="urgAdd">적기</button></div>`
      +(left.length?`<div class="sec">남은 일 ${left.length}</div>`+left.map(row).join(''):'')

  const y=$sheet.scrollTop; openModal(h); $sheet.scrollTop=y;

function itemRow(d,it,c){
  const v=logVal(d,it.id), f=frac(d,it), done=f>=1, lk=it.linkId&&linkOf(it.linkId);
  const sub = it.src==='routine' ? (it.days.length===7?'매일':it.days.map(x=>WD[x]).join('·')) : '오늘만';
  const ctl = it.kind==='count'
    ? `<div class="counter"><button data-act="dec" data-id="${it.id}">−</button><b>${v}/${it.target}${esc(it.unit)}</b><button data-act="inc" data-id="${it.id}">＋</button></div>` : '';
  return `<div class="item ${done?'done':''}" style="--c:${catCol(c)}" data-iid="${it.id}" data-src="${it.src}" data-cat="${c.id}" title="끌어서 순서 바꾸기"><span class="grip">⋮⋮</span>
    <button class="check" data-act="${it.kind==='check'?'toggle':'fill'}" data-id="${it.id}" aria-label="완료">${done?I('check'):''}</button>

}

/* --- 꽃밭: 누적 기록 --- */
function vStats(){
  const m=ui.statMode;
  $main.innerHTML = `<div class="pagehead"><h2>꽃밭</h2><p>하루하루 피운 국화가 모여 정원이 돼요.</p></div>
  <div class="seg"><button data-act="smode" data-m="week" class="${m==='week'?'on':''}">이번 주 꽃밭</button><button data-act="smode" data-m="month" class="${m==='month'?'on':''}">이달의 정원</button></div>`
   + (m==='week'?weekHtml():monthHtml());
}
function rangeStats(dates){
  const T=today(); const past=dates.filter(d=>d<=T);
  const ps=past.map(dayPct).filter(x=>x!==null);
  const avg=ps.length? ps.reduce((a,b)=>a+b,0)/ps.length : null;
  const good=ps.filter(x=>x>=0.8).length;
  const perCat={}, perItem={};
  past.forEach(d=>itemsFor(d).forEach(it=>{
    const f=frac(d,it);
    const pc=(perCat[it.catId]??={sum:0,n:0,votes:0}); pc.sum+=f; pc.n++; if(f>=1) pc.votes++;
    if(it.src!=='routine') return;
    (perItem[it.id]??={it,done:0,n:0}); perItem[it.id].n++; if(f>=1) perItem[it.id].done++;
  }));
  return {avg,good,days:ps.length,perCat,perItem};
}
function voteCard(perCat,title){
  const rows=cats().map(c=>{const x=perCat[c.id]; if(!x) return '';
    const v=x.sum/x.n; return `<div class="vote"><div class="l"><span>${ico(c.emoji)}</span><span class="i">${esc(c.identity||c.name)}</span><b>${x.votes}표 · ${Math.round(v*100)}%</b></div><div class="tr"><i style="width:${v*100}%;background:${catCol(c)}"></i></div></div>`;}).join('');
  return `<div class="card"><h3>${I('vote')} ${title}</h3><div class="muted" style="margin:-4px 0 4px">해낸 항목 하나 = 그 '나'에게 던진 한 표</div>${rows||'<div class="muted">기록이 아직 없어요.</div>'}</div>`;
}
function insightText(st){
  const arr=Object.values(st.perItem).filter(x=>x.n>=2).map(x=>({...x,r:x.done/x.n}));
  if(!arr.length) return '기록이 조금 더 쌓이면 꾸준함 분석을 보여 드릴게요.';
  arr.sort((a,b)=>b.r-a.r); const best=arr[0], worst=arr[arr.length-1];
  let s=`가장 꾸준히 피운 습관은 <b>${esc(best.it.title)}</b>(${best.done}/${best.n}회)예요.`;
  if(worst!==best && worst.r<0.6) s+=` <b>${esc(worst.it.title)}</b>${josa(worst.it.title,'은','는')} ${worst.done}/${worst.n}회로 자주 밀렸어요 — 목표를 절반으로 줄이거나 '언제·어디서' 할지 정해 두면 성공률이 올라가요.`;
  return s;
}

/* --- 미리 심기: 일정 --- */
function vSched(){
  const T=today();
  const up=S.events.filter(e=>e.date>=T).sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')));
  const past=S.events.filter(e=>e.date<T).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const group=list=>{let h='',last='';list.forEach(e=>{if(e.date!==last){h+=`<div class="dayhead ${e.date===T?'today':''}">${label(e.date)}${e.date===T?' · 오늘':e.date===addDays(T,1)?' · 내일':''}</div>`;last=e.date;}h+=evRow(e);});return h;};

const ago = iso => { const m=Math.round((Date.now()-new Date(iso))/6e4); if(isNaN(m)) return ''; if(m<1) return '방금'; if(m<60) return m+'분 전'; if(m<1440) return Math.round(m/60)+'시간 전'; const d=new Date(iso); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; };

/* ---------- 퀴즈 카드 백업(CSV) ---------- */
async function cardsCsv(){
  let srv=[];
  if(!DEMO()){ try{ toast('시트에서 카드를 가져오는 중…'); const r=await fetch(cfg.api+'?action=all&key='+encodeURIComponent(cfg.key)); const j=await r.json(); if(j.ok) srv=j.data.cards||[]; }catch(e){ toast('서버에 닿지 않아 이 기기 카드만 담아요'); } }
  const byId={}; LEGACY_CARDS.forEach(c=>byId[c.id]=c); srv.forEach(c=>byId[c.id]={...(byId[c.id]||{}),...c});
  const rows=Object.values(byId);
  if(!rows.length){ toast('담아 둔 퀴즈 카드가 없어요'); return; }
  const cols=[...new Set(['id','date','ko','en','note',...rows.flatMap(Object.keys)])];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='quiz-cards-backup-'+today()+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast(`카드 ${rows.length}장을 내려받았어요`);
}

function setLog(id,value){
  const d=ui.date, key=d+'|'+id, it=findItem(id), before=it?frac(d,it):0;
  if(value<=0) { if(S.logs.some(l=>l.id===key)) op({op:'delete',table:'logs',id:key}); }
  else op({op:'upsert',table:'logs',row:{id:key,date:d,itemId:id,value,updated:new Date().toISOString()}});
  render();
  if(it && before<1 && frac(d,it)>=1){
    const p=dayPct(d);
    if(p!==null&&p>=0.999) toast('마지막 꽃잎까지! 오늘의 국화가 피었어요');
    else { const c=catOf(it.catId); toast(`'${c.identity||c.name}'에게 한 표!`); }
  }
}
const findItem = id => itemsFor(ui.date).find(i=>i.id===id);

/* ---------- 이벤트 처리 ---------- */
let toastT, toastFn=null; function toast(m,btn,fn){const t=document.getElementById('toast');t.textContent=m;toastFn=fn||null;t.classList.toggle('act',!!fn);
  if(fn){const b=document.createElement('button');b.textContent=btn;b.onclick=()=>{t.classList.remove('show','act');toastFn&&toastFn();toastFn=null;};t.appendChild(b);}
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show','act'),fn?5000:2000);}
document.addEventListener('click',e=>{
  const pvb=e.target.closest('[data-pv]');
  if(pvb){ setTimeout(placeMemo,30); document.body.classList.toggle('mobile',pvb.dataset.pv==='mobile'); document.querySelectorAll('[data-pv]').forEach(b=>b.classList.toggle('on',b===pvb)); return; }
  const tb=e.target.closest('#tabs button'); if(tb){ ui.tab=tb.dataset.tab; render(); scrollTop(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==='A' && el.getAttribute('href')==='#') e.preventDefault();
  const it = id && findItem(id);
  switch(a){
    case 'day': ui.date=addDays(ui.date,+el.dataset.n); render(); break;
    case 'qTog': ui.qOpen=!ui.qOpen; render(); break;
    case 'shSched': openSheet('sched'); break;
    case 'shUrg': openSheet('urg'); setTimeout(()=>document.getElementById('urgIn')?.focus(),80); break;
    case 'shCat': openSheet('cat',id); break;
    case 'urgAdd': addMemo(); break;
    case 'gotoday': ui.date=today(); render(); break;
    case 'catTog': if(e.target.closest('.catadd')) break; ui.open[id]=!ui.open[id]; LS.set('open',ui.open); render(); break;
    case 'catAll': { const v=el.dataset.v==='1'; cats().forEach(c=>ui.open[c.id]=v); ui.open._=v; LS.set('open',ui.open); render(); break; }
    case 'theme': applyTheme(el.dataset.v); render(); break;
    case 'tab': ui.tab=el.dataset.tab; closeModal(); render(); scrollTop(); break;
    case 'toggle': setLog(id, logVal(ui.date,id)>=1?0:1); break;
    case 'fill': setLog(id, logVal(ui.date,id)>=it.target?0:it.target); break;
    case 'inc': setLog(id, logVal(ui.date,id)+1); break;
    case 'dec': setLog(id, Math.max(0,logVal(ui.date,id)-1)); break;
    case 'newItem': itemModal(null,el.dataset.cat); break;
    case 'editItem': { const src=el.dataset.src; const x = src==='routine'? {...S.routines.find(r=>r.id===id),src} : {...S.tasks.find(t=>t.id===id),src}; itemModal(x); break; }
    case 'mCat': M.catId=el.dataset.v; drawItemModal(); break;
    case 'mRep': M.repeat=el.dataset.v==='1'; drawItemModal(); break;
    case 'mKind': M.kind=el.dataset.v; drawItemModal(); break;
    case 'mLink': M.linkId=el.dataset.v; drawItemModal(); break;
    case 'mDay': { const w=+el.dataset.v; M.days=M.days.includes(w)?M.days.filter(x=>x!==w):[...M.days,w]; drawItemModal(); break; }
    case 'mSave': saveItem(); break;
    case 'mDel': if(M.src==='routine'){ const r=S.routines.find(x=>x.id===M.id); confirmBox(`<b>${esc(r.title)}</b>${josa(r.title,'을','를')} 오늘부터 그만할까요?<br><span class="muted">지난 기록은 꽃밭에 그대로 남아요.</span>`,()=>{ op({op:'upsert',table:'routines',row:{...r,end:addDays(today(),-1)}}); toast('그만하기 처리했어요'); }); }
                 else { op({op:'delete',table:'tasks',id:M.id}); closeModal(); render(); } break;
    case 'close': closeModal(); break;
    case 'memoAdd': addMemo(); break;
    case 'memoDel': delMemo(id); break;
    case 'memoTog': ui.memoOpen=!ui.memoOpen; renderMemo(); break;

    case 'memoClearDone': { const D=S.memos.filter(m=>m.done); D.forEach(m=>op({op:'delete',table:'memos',id:m.id})); renderMemo(); toast(`처리한 것 ${D.length}개를 지웠어요`,'되돌리기',()=>{ D.forEach(m=>op({op:'upsert',table:'memos',row:m})); renderMemo(); }); break; }

    case 'yes': closeModal(); M.onYes&&M.onYes(); render(); break;

/* ---------- 손가락으로 끌어 순서 바꾸기 ----------
   항목을 0.35초쯤 꾹 누르면 들리고, 그대로 끌어 같은 영역 안에서 자리를 옮길 수 있음 */
let DR=null, suppressClick=false;
function scroller(){ return document.body.classList.contains('mobile')?document.getElementById('frame'):null; }
function dragStart(item,x,y){
  const r=item.getBoundingClientRect(), ph=document.createElement('div');
  ph.className='drop-ph'; ph.style.height=r.height+'px'; item.parentNode.insertBefore(ph,item);
  Object.assign(item.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',margin:0});
  item.classList.add('dragging'); document.body.appendChild(item);
  DR={item,ph,cat:ph.parentNode,dy:y-r.top,on:true}; navigator.vibrate?.(12);
}
function dragMove(y){
  const {item,ph,cat,dy}=DR; item.style.top=(y-dy)+'px';
  const sibs=[...cat.querySelectorAll('.item')];
  let before=null; for(const s of sibs){ const b=s.getBoundingClientRect(); if(y<b.top+b.height/2){ before=s; break; } }
  if(before) cat.insertBefore(ph,before); else { const last=sibs[sibs.length-1]; if(last) last.after(ph); }
  const sc=scroller(), H=sc?sc.getBoundingClientRect():{top:0,bottom:innerHeight};   // 가장자리에서 자동 스크롤
  const step = y<H.top+70 ? -10 : y>H.bottom-150 ? 10 : 0;
  if(step){ sc? sc.scrollTop+=step : scrollBy(0,step); }
}
function dragEnd(){
  const {item,ph,cat}=DR; DR=null;
  item.classList.remove('dragging'); item.removeAttribute('style'); item.style.setProperty('--c',item.dataset.c||'');
  ph.replaceWith(item);
  const ids=[...cat.querySelectorAll('.item')].map(e=>({id:e.dataset.iid,src:e.dataset.src}));
  const rows=ids.map(x=>x.src==='routine'?S.routines.find(r=>r.id===x.id):S.tasks.find(t=>t.id===x.id)).filter(Boolean);
  const base=Math.min(...rows.map(r=>r.order||1e5));
  rows.forEach((r,k)=>{ const t=ids[k].src==='routine'?'routines':'tasks'; if(r.order!==base+k) op({op:'upsert',table:t,row:{...r,order:base+k}}); });
  suppressClick=true; setTimeout(()=>suppressClick=false,300); render();
}
(function(){
  let T=null, sx=0, sy=0, cand=null;
  const isCtl=t=>t.closest('button,a,input,textarea');
  const down=(e,x,y)=>{ const it=e.target.closest('.item[data-iid]'); if(!it||isCtl(e.target)) return;
    it.dataset.c=it.style.getPropertyValue('--c'); cand=it; sx=x; sy=y; clearTimeout(T); T=setTimeout(()=>{ if(cand){ dragStart(cand,x,y); cand=null; } },350); };
  let mouse=false;
  const move=(e,x,y)=>{ if(DR){ e.preventDefault(); dragMove(y); return; }
    if(cand&&(Math.abs(x-sx)>6||Math.abs(y-sy)>6)){ clearTimeout(T);
      if(mouse){ dragStart(cand,sx,sy); dragMove(y); }   // PC 마우스: 누른 채 움직이면 바로 끌기
      cand=null; } };
  const up=()=>{ clearTimeout(T); cand=null; if(DR) dragEnd(); };
  document.addEventListener('touchstart',e=>{ mouse=false; const t=e.touches[0]; down(e,t.clientX,t.clientY); },{passive:true});
  document.addEventListener('touchmove',e=>{ const t=e.touches[0]; move(e,t.clientX,t.clientY); },{passive:false});
  document.addEventListener('touchend',up); document.addEventListener('touchcancel',up);
  document.addEventListener('mousedown',e=>{ if(e.button===0 && !('ontouchstart' in window && e.sourceCapabilities?.firesTouchEvents)){ mouse=true; down(e,e.clientX,e.clientY); } });
  document.addEventListener('mousemove',e=>move(e,e.clientX,e.clientY));
  document.addEventListener('mouseup',up);
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('.item[data-iid]')) e.preventDefault(); });
  document.addEventListener('click',e=>{ if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); } },true);
})();

/* ---------- 여는 화면: 입체 국화 (옆에서 본 봉오리 → 활짝 핀 노란 국화) ---------- */
const B3=(()=>{
  const f=n=>n.toFixed(2), D=Math.PI/180;
  const mixc=(a,b,t)=>{ const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=h(a),B=h(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*Math.max(0,Math.min(1,t))).toString(16).padStart(2,'0')).join(''); };
  const sm=t=>t<=0?0:t>=1?1:0.5-0.5*Math.cos(Math.PI*t);
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  // 꽃잎 고리(바깥→안): 개수, 밑동 반지름, 높이, 길이, 너비, 닫힘 각, 핀 각, 끝 휨, 색, 피기 시작
  const RINGS=[   // 바깥→안쪽. 안쪽 꽃잎은 가운데로 오므라들어 소복한 공 모양을 만듦
    [20,2.4,0.0,19,4.6, 14, 98, 14,'#FFE68F',0.00],
    [18,2.1,0.8,18,4.5, 12, 80,  8,'#FFDC66',0.06],
    [16,1.8,1.7,16,4.3, 10, 62,  0,'#FFD04A',0.12],
    [15,1.4,2.6,14,4.0,  8, 44,-10,'#FFC23A',0.20],
    [13,1.0,3.4,12,3.7,  6, 28,-18,'#FDB22A',0.28],
    [10,0.6,4.1,9.5,3.3, 4, 14,-26,'#F7A21A',0.36],
    [ 7,0.3,4.6, 7,2.8,  2,  6,-30,'#F09412',0.44]];
  const PET=[]; // 꽃잎마다 고정된 작은 흔들림(자연스러움)
  RINGS.forEach((r,ri)=>{ for(let i=0;i<r[0];i++) PET.push({ri,i,dphi:(rnd()-.5)*10,dl:1+(rnd()-.5)*.14,dth:(rnd()-.5)*6}); });
  const TILT=32*D, V=[0,Math.sin(TILT),Math.cos(TILT)];
  const proj=(p,cx,cy,S)=>{ const y=p[1]*Math.cos(TILT)-p[2]*Math.sin(TILT), z=p[1]*Math.sin(TILT)+p[2]*Math.cos(TILT); return [cx+p[0]*S, cy-y*S, z]; };
  const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
  function petal(base,th,phi,curl,L,w,col,cx,cy,S,shadeK){
    const t=[-Math.sin(th),0,Math.cos(th)];
    const dir=ph=>[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];
    const d1=dir(phi), d2=dir(phi+curl*D);
    const mid=add(base,d1,L*0.55), tip=add(mid,d2,L*0.45);
    const pts=[], N=10;
    const C=u=>{ const a=(1-u)*(1-u),b=2*u*(1-u),c=u*u; return [base[0]*a+mid[0]*b+tip[0]*c, base[1]*a+mid[1]*b+tip[1]*c, base[2]*a+mid[2]*b+tip[2]*c]; };
    const hw=u=>w*(0.28+0.72*Math.pow(Math.sin(Math.PI*(0.12+0.5*u)),0.8));
    for(let k=0;k<=N;k++){ const u=k/N; pts.push(add(C(u),t,hw(u))); }
    const dd=[tip[0]-mid[0],tip[1]-mid[1],tip[2]-mid[2]], dl=Math.hypot(...dd)||1, dn=dd.map(x=>x/dl);
    for(let k=1;k<8;k++){ const a=Math.PI*k/8; pts.push(add(add(tip,t,hw(1)*Math.cos(a)),dn,hw(1)*0.75*Math.sin(a))); }  // 둥근 꽃잎 끝
    for(let k=N;k>=0;k--){ const u=k/N; pts.push(add(C(u),t,-hw(u))); }
    const P=pts.map(p=>proj(p,cx,cy,S));
    // 면이 보이는 방향에 따라 밝기(입체감)
    const n=[-Math.cos(th)*Math.cos(phi),Math.sin(phi),-Math.sin(th)*Math.cos(phi)], k=n[0]*V[0]+n[1]*V[1]+n[2]*V[2];
    const fill = k>0 ? mixc(col,'#FFF6CF',k*0.45*shadeK) : mixc(col,'#D98200',-k*0.55);
    let dstr=`M${f(P[0][0])} ${f(P[0][1])}`; for(let i=1;i<P.length;i++){ const q=P[i], pr=P[i-1]; dstr+=` Q${f(pr[0])} ${f(pr[1])} ${f((pr[0]+q[0])/2)} ${f((pr[1]+q[1])/2)}`; } dstr+='Z';
    const z=(proj(mid,cx,cy,S)[2]+proj(tip,cx,cy,S)[2])/2;
    return {z, svg:`<path d="${dstr}" fill="${fill}" stroke="#D99400" stroke-opacity=".28" stroke-width=".35" stroke-linejoin="round"/>`};
  }
  function head(o,cx,cy,S){
    const parts=[];
    // 꽃받침(초록): 봉오리를 감싸다가 아래로 젖혀짐
    for(let i=0;i<5;i++){ const th=i*72*D+0.3, ph=(95+35*sm(o))*D;   // 작은 초록 꽃받침: 항상 꽃잎 아래·뒤에만(노란 부분을 덮지 않음)
      parts.push(Object.assign(petal([Math.cos(th)*1.8,-0.9,Math.sin(th)*1.8],th,ph,10,7,2.8,'#5E9A50',cx,cy,S,0.4),{z:-3000})); }
    PET.forEach(p=>{ const r=RINGS[p.ri]; const [n,r0,h0,L,w,pc,po,curl,col,dl]=r;
      const q=sm((o-dl)/0.62);                                     // 바깥 꽃잎부터 차례로 벌어짐
      const th=(p.i*360/n+(p.ri%2?180/n:0)+p.dth)*D;
      const phi=(pc+(po-pc)*q+p.dphi*q)*D, len=L*(0.42+0.58*sm(o/0.85))*p.dl, wid=w*(0.75+0.25*q);
      const colB=mixc(col,'#F2E08A',(1-sm(o/0.4))*0.55);   // 처음부터 살짝 노란 봉오리
      const base=[Math.cos(th)*r0,h0,Math.sin(th)*r0];
      parts.push(petal(base,th,phi,curl*q,len,wid,colB,cx,cy,S,1)); });
    { const c0=proj([0,1.2,0],cx,cy,S); parts.push({z:-1000,svg:`<ellipse cx="${f(c0[0])}" cy="${f(c0[1])}" rx="${f(5*S)}" ry="${f(3.4*S)}" fill="#F5A82A"/>`}); }
    { const c=proj([0,4.2,0],cx,cy,S); parts.push({z:-999,svg:`<ellipse cx="${f(c[0])}" cy="${f(c[1])}" rx="${f(3.2*S)}" ry="${f(2.2*S)}" fill="#F0960F"/>`}); }   // 꽃잎 틈으로 바탕이 비치지 않게
    parts.sort((a,b)=>a.z-b.z);
    let s=parts.map(x=>x.svg).join('');
    return s;
  }
  function leaf(x,y,rot,sc,flip){  // 넓고 둥글게 갈라진 국화 잎
    return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc*(flip?-1:1)} ${sc})"><path d="M0 0 C4 -9 12 -14 18 -12 C19 -19 27 -21 31 -15 C35 -20 43 -18 44 -11 C50 -12 54 -6 51 -1 C56 1 55 7 50 8 C53 13 48 18 43 15 C41 21 33 22 30 16 C26 22 18 21 17 15 C10 17 3 11 0 0Z" fill="#3E7D53"/><path d="M1 0 C15 0 32 1 51 3" stroke="#78B58A" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M17 1 L23 -9 M30 1.5 L35 -11 M41 2 L46 -6 M23 1.5 L27 11 M35 2 L40 12" stroke="#78B58A" stroke-width="1" fill="none" stroke-linecap="round"/></g>`;
  }
  function svg(o,sway){
    const S=1.15+0.6*sm(o), cx=50, cy=46-10*sm(o), stemTop=cy+5;
    return `<svg viewBox="0 0 100 100" width="250" height="250" aria-hidden="true"><g transform="rotate(${f(sway)} 50 100)">
      <path d="M50 100 C48 88 52 72 50 ${f(stemTop)}" stroke="#2F7A4A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      ${leaf(49.5,90,-158,0.46,false)}${leaf(50.5,84,-24,0.44,false)}
      ${head(o,cx,cy,S)}</g></svg>`;
  }
  return {svg};
})();

function splash(){
  const el=document.getElementById('splash'), fl=el.querySelector('.sf'); let t0=null, done=false;
  const sm=t=>t<=0?0:t>=1?1:0.5-0.5*Math.cos(Math.PI*t);
  const BLOOM=3600, START=0.3;                                     // 꽃잎이 1/3쯤 올라온 노란 봉오리에서 시작
  const finish=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),600); };
  el.addEventListener('click',finish);
  const step=ts=>{ if(done) return; if(!t0) t0=ts; const t=Math.min(1,(ts-t0)/BLOOM);
    const o=START+(1-START)*sm(Math.max(0,(t-0.1)/0.9));
    fl.innerHTML=B3.svg(o, Math.sin(t*Math.PI*1.6)*2*(1-t));
    if(t<1) requestAnimationFrame(step); else { el.classList.add('txt'); setTimeout(finish,1300); } };
  requestAnimationFrame(step);
